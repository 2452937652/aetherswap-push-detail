    <style>
:root {
  --bg-body: #F7F7F9;
  --bg-sidebar: rgba(255, 255, 255, 0.75);
  --bg-surface: #FFFFFF;
  --bg-input: #F4F4F5;
  --text-main: #09090B;
  --text-secondary: #52525B;
  --text-muted: #A1A1AA;
  --text-inverse: #FFFFFF;
  --border-color: rgba(0, 0, 0, 0.08);
  --border-focus: #18181B;
  --primary: #18181B;
  --primary-hover: #27272A;
  --primary-light: rgba(24, 24, 27, 0.05);
  --primary-text: #FFFFFF;
  --primary-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
  --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.06), 0 12px 24px rgba(0, 0, 0, 0.03);
  --shadow-glow: 0 0 0 1px rgba(0, 0, 0, 0.03), 0 8px 24px rgba(0, 0, 0, 0.04);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', monospace;
  --sidebar-width: 250px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.2, 0.9, 0.4, 1.05);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --duration-fast: 0.2s;
  --duration-normal: 0.35s;
  --duration-slow: 0.5s;
  --gradient-primary: linear-gradient(135deg, #18181B, #3F3F46);
  --gradient-accent: linear-gradient(135deg, #6366F1, #8B5CF6);
  --gradient-success: linear-gradient(135deg, #059669, #10B981);
  --glow-primary: rgba(24, 24, 27, 0.15);
  --glow-accent: rgba(99, 102, 241, 0.3);
  --glow-success: rgba(16, 185, 129, 0.3);
}
[data-theme="dark"] {
  --bg-body: #000000;
  --bg-sidebar: rgba(10, 10, 10, 0.65);
  --bg-surface: #09090B;
  --bg-input: #18181B;
  --text-main: #EDEDED;
  --text-secondary: #A1A1AA;
  --text-muted: #52525B;
  --text-inverse: #000000;
  --border-color: rgba(255, 255, 255, 0.1);
  --border-focus: #EDEDED;
  --primary: #EDEDED;
  --primary-hover: #FFFFFF;
  --primary-light: rgba(255, 255, 255, 0.12);
  --primary-text: #000000;
  --primary-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.8);
  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.9);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 1);
  --shadow-lg: 0 32px 64px rgba(0, 0, 0, 1);
  --shadow-glow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 8px 32px rgba(255, 255, 255, 0.04);
  --gradient-primary: linear-gradient(135deg, #E4E4E7, #A1A1AA);
  --gradient-accent: linear-gradient(135deg, #818CF8, #A78BFA);
  --gradient-success: linear-gradient(135deg, #34D399, #6EE7B7);
  --glow-primary: rgba(255, 255, 255, 0.12);
  --glow-accent: rgba(129, 140, 248, 0.35);
  --glow-success: rgba(52, 211, 153, 0.35);
}
</style>

    <style>
* {
  box-sizing: border-box;
  outline: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg-body);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background 0.4s var(--ease-out), color 0.3s var(--ease-out);
}

.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-sidebar);
  backdrop-filter: blur(28px) saturate(1.8);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  transition: transform 0.35s var(--ease-out);
  z-index: 50;
  gap: 6px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 28px;
  padding: 4px 12px;
}

.logo-hitbox {
  width: 44px;
  height: 44px;
  margin: -4px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.logo-box {
  width: 36px;
  height: 36px;
  background: var(--gradient-primary);
  background-size: 200% 200%;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary-text);
  box-shadow: var(--shadow-sm);
  transform-origin: center center;
  transform: translateZ(0) rotate(0deg) scale(1);
  backface-visibility: hidden;
  will-change: transform;
  transition: transform 0.4s var(--ease-spring), box-shadow 0.3s;
}

.logo-hitbox:hover .logo-box {
  transform: translateZ(0) rotate(8deg) scale(1.08);
  box-shadow: var(--shadow-md);
}

.logo-box svg {
  display: block;
  width: 20px;
  height: 20px;
}

.brand-name {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.03em;
  color: var(--text-main);
}

.brand-desc {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-top: 2px;
}

.nav-menu {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  margin-top: 10px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
  position: relative;
  isolation: isolate;
  overflow: visible;
}

.nav-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%) scaleY(0);
  translate: 0 0;
  width: 3px;
  height: 60%;
  border-radius: 0 3px 3px 0;
  background: var(--gradient-accent);
  transition: transform 0.3s var(--ease-spring), translate 0.25s var(--ease-spring);
  z-index: 1;
}

.nav-item::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid transparent;
  border-radius: inherit;
  background: transparent;
  box-shadow: none;
  translate: 0 0;
  transition: all 0.25s var(--ease-spring);
  pointer-events: none;
  z-index: 0;
}

.nav-item .icon {
  width: 18px;
  height: 18px;
  opacity: 0.7;
  translate: 0 0;
  transition: opacity 0.2s, translate 0.25s var(--ease-spring);
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}

.nav-item span {
  translate: 0 0;
  transition: translate 0.25s var(--ease-spring);
  position: relative;
  z-index: 2;
}

.nav-item:hover {
  color: var(--text-main);
}

.nav-item:hover::after {
  background: var(--primary-light);
  translate: 4px 0;
}

.nav-item:hover>.icon,
.nav-item:hover>span,
.nav-item.active>.icon,
.nav-item.active>span {
  translate: 4px 0;
}

.nav-item:hover .icon {
  animation: iconBounce 0.4s var(--ease-spring);
}

.nav-item:hover>.icon {
  opacity: 1;
}

.nav-item.active {
  color: var(--primary);
  font-weight: 600;
}

.nav-item.active::before {
  transform: translateY(-50%) scaleY(1);
  translate: 4px 0;
}

.nav-item.active::after {
  background: var(--bg-surface);
  border-color: var(--border-color);
  box-shadow: var(--shadow-sm);
  translate: 4px 0;
}

.nav-item.active .icon {
  opacity: 1;
}

.theme-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 14px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  transition: all 0.2s var(--ease-spring);
}

.theme-toggle:hover {
  color: var(--text-main);
  background: var(--primary-light);
  transform: scale(0.98);
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: var(--bg-body);
}

.page-title {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.02em;
  color: var(--text-main);
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 6px 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 999px;
  box-shadow: var(--shadow-xs);
  font-weight: 500;
}

.status-dot-pulse {
  width: 8px;
  height: 8px;
  background: var(--text-muted);
  border-radius: 50%;
}

.status-running .status-dot-pulse {
  background: var(--success);
  animation: pulse-green 2s infinite;
}

.status-error .status-dot-pulse {
  background: var(--danger);
}

.separator {
  color: var(--text-muted);
  opacity: 0.5;
  margin: 0 4px;
}

.status-time {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 12px;
}

@keyframes pulse-green {
  0% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
  }

  70% {
    box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
  }
}

.panel {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 0 36px 36px;
  animation: panelSlideIn 0.5s var(--ease-spring);
}

.panel.active {
  display: block;
  animation: panelSlideIn 0.45s var(--ease-spring);
}

@keyframes panelFadeIn {
  from {
    opacity: 0;
    transform: translateY(16px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-surface);
  padding: 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  transition: transform 0.35s var(--ease-spring), box-shadow 0.35s var(--ease-out), border-color 0.35s;
  position: relative;
  overflow: hidden;
  opacity: 0;
  animation: slideUp 0.5s var(--ease-spring) both;
}

.stat-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  transition: opacity 0.4s;
  background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.03) 50%, transparent 60%);
  background-size: 200% 200%;
  pointer-events: none;
}

.stat-card:hover::after {
  opacity: 1;
  animation: shimmer 2s linear infinite;
}

.stat-card:hover {
  transform: translateY(-6px) scale(1.01);
  box-shadow: var(--shadow-md);
  border-color: var(--border-focus);
}

.stat-card:nth-child(1) {
  animation-delay: 0s;
}

.stat-card:nth-child(2) {
  animation-delay: 0.08s;
}

.stat-card:nth-child(3) {
  animation-delay: 0.16s;
}

.stat-card:nth-child(4) {
  animation-delay: 0.24s;
}

.stat-card.primary {
  background: var(--primary);
  background-image: var(--gradient-primary);
  background-size: 200% 200%;
  animation: slideUp 0.5s var(--ease-spring) both, gradientShift 8s ease-in-out infinite;
  color: var(--primary-text);
  border-color: transparent;
  box-shadow: var(--primary-shadow);
}

.stat-card.primary .stat-label {
  color: rgba(255, 255, 255, 0.7);
}

[data-theme="dark"] .stat-card.primary .stat-label {
  color: rgba(0, 0, 0, 0.6);
}

.stat-card.primary .stat-value {
  color: var(--primary-text);
}

.stat-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 500;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: -1px;
  transition: color 0.2s;
}

.stat-trend {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  margin-top: 12px;
  background: var(--bg-body);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-weight: 500;
  color: var(--text-secondary);
}

.stat-trend.positive {
  color: var(--success);
}

.stat-card.primary .stat-trend {
  background: rgba(255, 255, 255, 0.15);
  color: var(--primary-text);
}

[data-theme="dark"] .stat-card.primary .stat-trend {
  background: rgba(0, 0, 0, 0.1);
  color: var(--primary-text);
}

.stat-trend svg {
  width: 14px;
  height: 14px;
}

.control-bar {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
  transition: border-color 0.5s, box-shadow 0.5s;
}

.status-running~.main-content .control-bar,
.control-bar.running {
  animation: breathePulse 3s ease-in-out infinite;
  border-color: var(--success);
}

.control-info {
  flex: 1;
  min-width: 0;
}

.info-item {
  display: flex;
  flex-direction: column;
}

.info-item .label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 4px;
}

.info-item .value {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
}

.lyric-scroll-viewport {
  position: relative;
  width: 100%;
  height: 24px;
  overflow: hidden;
  transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
}

.lyric-scroll-track {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}

.lyric-line {
  height: 24px;
  line-height: 24px;
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font-mono);
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 0;
}

.lyric-sub {
  opacity: 0.3;
  transition: opacity 0.5s ease;
}

.control-actions {
  display: flex;
  gap: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
  border: 1px solid transparent;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--ripple-x, 50%) var(--ripple-y, 50%), rgba(255, 255, 255, 0.2), transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.btn:hover::after {
  opacity: 1;
}

.btn:active {
  transform: scale(0.96);
}

.btn-primary {
  background: var(--primary);
  color: var(--primary-text);
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
  background: var(--primary-hover);
  box-shadow: 0 4px 16px var(--glow-primary), var(--primary-shadow);
}

.btn-hover-anchor {
  display: inline-flex;
}

.btn-hover-anchor:hover .btn-primary {
  background: var(--primary-hover);
  box-shadow: 0 4px 16px var(--glow-primary), var(--primary-shadow);
  transform: translateY(-2px);
}

.btn-hover-anchor:hover .btn-primary::after {
  opacity: 1;
}

.btn-hover-anchor:hover .btn-primary:active {
  transform: translateY(0) scale(0.96);
}

.btn-primary svg {
  width: 16px;
  height: 16px;
  transition: transform 0.2s var(--ease-spring);
}

.btn-primary:hover svg {
  transform: scale(1.1);
}

.btn-hover-anchor:hover .btn-primary svg {
  transform: scale(1.1);
}

.btn-secondary {
  background: var(--bg-surface);
  border-color: var(--border-color);
  color: var(--text-main);
  box-shadow: var(--shadow-xs);
}

.btn-secondary:hover {
  background: var(--bg-input);
  border-color: var(--text-muted);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background: var(--primary-light);
  color: var(--text-main);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-main);
}

.btn-outline:hover {
  background: var(--bg-input);
  border-color: var(--border-focus);
}

.btn-edit {
  background: transparent;
  border: 1px solid var(--primary);
  color: var(--primary);
}

.btn-edit:hover {
  background: var(--primary-light);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
  border: 1px solid var(--danger);
  box-shadow: var(--shadow-xs);
}

.btn-danger:hover {
  background: #dc2626;
  border-color: #dc2626;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
  transform: translateY(-2px);
}

.btn-danger-outline {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  box-shadow: var(--shadow-xs);
}

.btn-danger-outline:hover {
  background: rgba(239, 68, 68, 0.1);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 13px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  color: var(--text-secondary);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
  box-shadow: var(--shadow-xs);
}

.icon-btn:hover {
  border-color: var(--border-focus);
  color: var(--text-main);
  background: var(--bg-body);
  box-shadow: var(--shadow-sm);
  transform: translateY(-2px) scale(1.05);
}

.icon-btn:active {
  transform: translateY(0) scale(0.95);
}

.payment-alert {
  background: var(--bg-surface);
  border: 1px solid var(--border-focus);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  box-shadow: var(--shadow-glow);
}

.payment-content {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.payment-icon {
  color: var(--warning);
  margin-top: 2px;
}

.payment-text h3 {
  margin: 0 0 6px 0;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
}

.payment-text p {
  margin: 0;
  font-size: 14px;
  color: var(--text-secondary);
}

.payment-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.link-btn {
  color: var(--primary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  background: none;
  border: none;
  cursor: pointer;
  transition: opacity 0.2s;
}

.link-btn:hover {
  opacity: 0.7;
}

.divider-v {
  width: 1px;
  height: 16px;
  background: var(--border-color);
}

.hidden {
  display: none !important;
}

.settings-layout {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.settings-group {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-xs);
  transition: box-shadow 0.35s, transform 0.35s var(--ease-spring), border-color 0.35s;
  position: relative;
}

.settings-group::before {
  content: '';
  position: absolute;
  left: 0;
  top: 24px;
  bottom: 24px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--gradient-accent);
  opacity: 0;
  transform: scaleY(0);
  transition: opacity 0.3s, transform 0.3s var(--ease-spring);
}

.settings-group:hover {
  box-shadow: var(--shadow-sm);
  transform: translateY(-2px);
}

.settings-group:hover::before {
  opacity: 1;
  transform: scaleY(1);
}

.settings-group h2 {
  margin: 0 0 20px 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.form-grid {
  display: grid;
  gap: 16px;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.field-row--3 {
  grid-template-columns: repeat(3, 1fr);
}

.field-row--4 {
  grid-template-columns: repeat(4, 1fr);
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.field--switch {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.field--switch label.checkbox-wrapper {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--text-main);
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}

.field--switch .field-hint {
  width: 100%;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.settings-group input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--border-focus);
  cursor: pointer;
}

.settings-group .field:has(> label.checkbox-wrapper) {
  margin-bottom: 0;
}

input,
select,
textarea {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.25s var(--ease-out);
}

input:focus,
select:focus,
textarea:focus {
  background: var(--bg-surface);
  border-color: var(--border-focus);
  box-shadow: 0 0 0 4px var(--primary-light);
  transform: scale(1.01);
}

input::placeholder,
textarea::placeholder {
  color: var(--text-muted);
}

.settings-group textarea {
  min-height: 80px;
  resize: vertical;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
}

.file-btn {
  position: relative;
  overflow: hidden;
}

.table-container {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-xs);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  text-align: left;
  padding: 14px 18px;
  background: var(--bg-body);
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 12px;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 2;
}

#panel-steam-deals th {
  position: static;
  z-index: auto;
}

td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-main);
  transition: background 0.2s, padding-left 0.25s var(--ease-spring);
}

tr:last-child td {
  border-bottom: none;
}

tbody tr {
  transition: transform 0.2s var(--ease-out);
}

tr:hover td {
  background: var(--bg-input);
}

tr:hover td:first-child {
  box-shadow: inset 3px 0 0 var(--border-focus);
}

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.holding-select-cell {
  width: 48px;
  min-width: 48px;
  padding: 10px 14px;
  vertical-align: middle;
}

.holding-select-cell .holding-checkbox,
.holding-select-cell .history-checkbox {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--border-focus);
}

.tx-actions {
  white-space: nowrap;
}

.text-ok {
  color: var(--success) !important;
}

.text-bad {
  color: var(--danger) !important;
}

.status-cell.status-holding {
  color: #3B82F6;
  font-weight: 500;
}

.status-cell.status-listing {
  color: #8B5CF6;
  font-weight: 500;
}

.status-cell.status-pending {
  color: var(--warning);
  font-weight: 500;
}

.status-cell.status-sold {
  color: var(--success);
  font-weight: 500;
}

.status-cell.status-error {
  color: var(--danger);
  font-weight: 500;
}

.status-cell.status-not-found {
  color: var(--danger);
  font-weight: 700;
}

.holding-row-not-found > td {
  background: color-mix(in srgb, var(--danger) 8%, transparent);
}

.holding-not-found-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 6px;
  border: 1px solid color-mix(in srgb, var(--danger) 55%, transparent);
  border-radius: 999px;
  color: var(--danger);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.35;
  white-space: nowrap;
}

.holding-name-cell {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.holding-price-check-btn {
  flex: 0 0 auto;
  padding: 3px 8px;
  border: 1px solid color-mix(in srgb, var(--primary) 62%, var(--border-color));
  border-radius: 999px;
  background: color-mix(in srgb, var(--primary) 9%, transparent);
  color: var(--primary);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
  cursor: pointer;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
}

.holding-price-check-btn:hover {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 16%, transparent);
  transform: translateY(-1px);
}

.holding-price-check-btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.app-modal.app-modal--holding-price {
  width: min(100%, 820px);
}

.holding-price-modal {
  color: var(--text-main);
}

.holding-price-modal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 11px 13px;
  border: 1px solid color-mix(in srgb, var(--primary) 22%, var(--border-color));
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--primary) 6%, var(--bg-input));
}

.holding-price-modal-kicker {
  display: block;
  color: var(--primary);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  line-height: 1.3;
}

.holding-price-modal-toolbar-note {
  display: block;
  margin-top: 3px;
  color: var(--text-secondary);
  font-size: 12px;
}

.holding-price-modal-actions {
  display: flex;
  flex: 0 0 auto;
  gap: 8px;
}

.holding-price-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.holding-price-summary-item {
  min-width: 0;
  padding: 10px 11px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--bg-input) 72%, transparent);
}

.holding-price-summary-label,
.holding-price-metric-label {
  display: block;
  color: var(--text-muted);
  font-size: 11px;
}

.holding-price-summary-value {
  display: block;
  overflow: hidden;
  margin-top: 5px;
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.holding-price-modal-note {
  margin-top: 12px;
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.5;
}

.holding-price-modal-status {
  margin-top: 10px;
  padding: 9px 11px;
  border-left: 3px solid var(--primary);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: color-mix(in srgb, var(--primary) 8%, transparent);
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.45;
}

.holding-price-modal-status.text-bad {
  border-left-color: var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  color: var(--danger);
}

.holding-price-platform-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.holding-price-platform-card {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-input);
}

.holding-price-platform-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.holding-price-platform-name {
  color: var(--text-main);
  font-size: 13px;
  font-weight: 800;
}

.holding-price-platform-source {
  overflow: hidden;
  color: var(--text-muted);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.holding-price-platform-metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.holding-price-metric {
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--bg-card) 70%, transparent);
}

.holding-price-metric-value {
  display: block;
  margin-top: 4px;
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}

.holding-price-metric--buy .holding-price-metric-value {
  color: var(--success);
}

.holding-price-platform-meta {
  margin-top: 9px;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.4;
}

@media (max-width: 720px) {
  .holding-price-modal-toolbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .holding-price-modal-actions {
    width: 100%;
  }

  .holding-price-modal-actions .btn {
    flex: 1;
  }

  .holding-price-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .holding-price-platform-grid {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  .holding-price-check-btn {
    transition: none;
  }

  .holding-price-check-btn:hover {
    transform: none;
  }
}

.inv-links {
  white-space: nowrap;
}

.inv-links a {
  font-size: 12px;
  margin-right: 12px;
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}

.inv-links a:hover {
  color: var(--primary);
}

.inv-links .link-buff {
  color: var(--success);
}

.tx-type {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

.tx-type.purchase {
  background: var(--bg-input);
  color: var(--text-main);
}

.tx-type.sale {
  background: var(--primary-light);
  color: var(--primary);
}

.purchases-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: center;
  padding: 14px 20px;
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  font-size: 13px;
  box-shadow: var(--shadow-xs);
}

.purchases-summary .summary-stat {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
}

.purchases-summary .summary-label {
  color: var(--text-secondary);
  font-size: 12px;
}

.purchases-summary .summary-value {
  font-weight: 600;
  font-size: 15px;
  color: var(--text-main);
}

.purchases-summary .summary-value.mono {
  font-family: var(--font-mono);
}

.add-purchase-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  background: var(--bg-surface);
  padding: 14px 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.add-purchase-bar .label {
  color: var(--text-main);
  font-size: 14px;
  font-weight: 600;
  margin-right: 8px;
}

.add-purchase-bar input[type="text"] {
  width: 180px;
}

.add-purchase-bar input[type="number"] {
  width: 120px;
}

.add-purchase-bar #add-purchase-steam-link {
  min-width: 300px;
  flex: 1;
}

.add-purchase-bar #add-purchase-quantity {
  width: 80px;
}

.console-wrapper {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  height: calc(100vh - 140px);
  overflow: hidden;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
}

.console-toolbar {
  background: var(--bg-body);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
}

.console-filters {
  display: flex;
  gap: 12px;
  align-items: center;
}

.console-filters input,
.console-filters select {
  width: 160px;
}

.console-body {
  flex: 1;
  padding: 20px 24px;
  margin: 0;
  overflow-y: auto;
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.8;
}

#toast-host {
  position: fixed;
  top: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
  z-index: 999;
  pointer-events: none;
  max-width: min(400px, calc(100vw - 48px));
}

#toast-host .toast {
  pointer-events: auto;
}

.toast {
  background: var(--bg-surface);
  color: var(--text-main);
  padding: 16px 20px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
  min-width: 280px;
  max-width: 100%;
  animation: toastEnter 0.45s var(--ease-spring);
  backdrop-filter: blur(16px);
  position: relative;
  overflow: hidden;
}

.toast.toast-exit {
  animation: toastExit 0.35s var(--ease-out) forwards;
}

.toast::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gradient-accent);
  transform-origin: left;
  animation: progressShrink 3.5s linear forwards;
}

.toast .t {
  font-weight: 600;
  font-size: 14px;
}

.toast .d {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
  overflow: hidden;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.app-modal-host {
  position: fixed;
  inset: 0;
  z-index: 1400;
  display: grid;
  place-items: center;
  padding: 24px;
  opacity: 0;
  transition: opacity 0.18s var(--ease-out);
}

.app-modal-host.shown {
  opacity: 1;
}

.app-modal-host.closing {
  opacity: 0;
}

.app-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.42);
  backdrop-filter: blur(14px) saturate(1.25);
  -webkit-backdrop-filter: blur(14px) saturate(1.25);
}

.app-modal {
  position: relative;
  width: min(100%, 460px);
  max-height: min(760px, calc(100vh - 48px));
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateY(10px) scale(0.98);
  transition: transform 0.2s var(--ease-spring);
}

.app-modal-host.shown .app-modal {
  transform: translateY(0) scale(1);
}

.app-modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
}

.app-modal-head h3 {
  margin: 0;
  color: var(--text-main);
  font-size: 17px;
  line-height: 1.35;
}

.app-modal-close {
  width: 30px;
  height: 30px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-body);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
}

.app-modal-message {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.65;
  max-height: min(26vh, 180px);
  overflow: auto;
  overflow-wrap: anywhere;
  padding-right: 4px;
}

.app-modal-export {
  margin-top: 12px;
}

.app-modal-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  min-height: 0;
}

.app-modal-input {
  min-height: 0;
}

textarea.app-modal-input {
  max-height: min(34vh, 260px);
  resize: vertical;
}

.app-modal-content {
  margin-top: 16px;
  max-height: min(62vh, 560px);
  overflow: auto;
  min-height: 0;
}

.app-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-color);
}

@media (max-width: 600px) {
  .app-modal-host {
    padding: 14px;
  }

  .app-modal-actions {
    flex-direction: column-reverse;
  }

  .app-modal-actions .btn {
    width: 100%;
  }
}

.relogin-overlay,
.overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: overlayFadeIn 0.3s var(--ease-out);
}

.relogin-overlay.hidden,
.overlay.hidden {
  display: none;
}

.relogin-modal,
.overlay-content {
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  padding: 32px;
  max-width: 460px;
  max-height: min(720px, calc(100vh - 48px));
  width: 90%;
  overflow: auto;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
  animation: modalBounceIn 0.5s var(--ease-spring);
}

@keyframes modalPop {
  from {
    transform: scale(0.95) translateY(10px);
    opacity: 0;
  }

  to {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
}

.relogin-modal h3,
.account-form-card h3 {
  margin: 0 0 12px 0;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-main);
}

.relogin-modal p,
.account-form-card .form-hint {
  margin: 0 0 24px 0;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.relogin-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.account-form-card .form-grid {
  margin-top: 20px;
}

.account-form-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 24px;
}

.panel-toolbar--accounts {
  gap: 16px;
  margin-bottom: 24px;
}

.toolbar-title {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.toolbar-title .hint {
  color: var(--text-muted);
  font-size: 13px;
}

.toolbar-actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.input-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  border-radius: 999px;
  background: var(--bg-input);
  min-width: 260px;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

.input-pill:focus-within {
  border-color: var(--border-focus);
  background: var(--bg-surface);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.input-pill .icon {
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.input-pill input {
  border: none;
  outline: none;
  background: transparent;
  color: var(--text-main);
  width: 100%;
  font-size: 14px;
  padding: 0;
}

.accounts-layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 24px;
  align-items: start;
}

.accounts-left,
.accounts-right {
  min-width: 0;
}

.accounts-list {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-xs);
}

.accounts-list-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-body);
}

.accounts-list-header .title {
  font-weight: 600;
  font-size: 13px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.accounts-list-header .count {
  font-size: 13px;
  color: var(--text-muted);
}

.account-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  cursor: pointer;
  transition: background 0.2s;
}

.account-item:hover {
  background: var(--bg-input);
}

.account-item.active {
  background: var(--bg-body);
  border-left: 3px solid var(--border-focus);
  padding-left: 17px;
}

.account-item+.account-item {
  border-top: 1px solid var(--border-color);
}

.account-avatar-wrap {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  position: relative;
}

.account-avatar {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  object-fit: cover;
  background: var(--bg-body);
  border: 1px solid var(--border-color);
}

.account-avatar.placeholder {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--bg-body);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
  font-weight: 600;
  font-size: 16px;
  border: 1px solid var(--border-color);
}

.account-item-body {
  flex: 1;
  min-width: 0;
}

.account-item-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  color: var(--text-main);
}

.account-item-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}

.badge.badge-current {
  background: var(--text-main);
  color: var(--text-inverse);
}

.account-detail {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.account-detail-header {
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid var(--border-color);
}

.account-detail-main {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.account-detail-title {
  font-weight: 700;
  font-size: 20px;
  color: var(--text-main);
}

.account-detail-meta {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.account-detail-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.account-detail-body {
  padding: 24px;
}

.kv-grid {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 12px 16px;
}

.kv {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-body);
}

.kv .k {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 500;
}

.kv .v {
  margin-top: 6px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-main);
  overflow-wrap: anywhere;
}

.callout {
  margin-top: 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-input);
  padding: 16px 20px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.callout .callout-icon {
  width: 20px;
  height: 20px;
  margin-top: 2px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.callout .callout-text {
  font-size: 14px;
  color: var(--text-main);
  line-height: 1.6;
}

.account-detail-empty {
  padding: 64px 24px;
  text-align: center;
}

.account-detail-empty .empty-icon {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  background: var(--bg-input);
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  border: 1px solid var(--border-color);
}

.account-detail-empty h3 {
  margin: 0 0 8px 0;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-main);
}

.account-detail-empty p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
}

.steam-token-page {
  min-height: calc(100vh - 160px);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.steam-token-glow {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 999px;
  background: radial-gradient(circle at center, rgba(37, 99, 235, 0.15), transparent 60%);
  filter: blur(60px);
  opacity: 0.6;
  pointer-events: none;
  animation: glowPulse 5s ease-in-out infinite;
}

[data-theme="dark"] .steam-token-glow {
  background: radial-gradient(circle at center, rgba(255, 255, 255, 0.05), transparent 60%);
}

@keyframes glowPulse {

  0%,
  100% {
    transform: scale(1);
    opacity: 0.6;
  }

  50% {
    transform: scale(1.1);
    opacity: 0.8;
  }
}

.steam-token-card {
  position: relative;
  z-index: 1;
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  padding: 40px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 440px;
  width: 100%;
}

.steam-token-title {
  margin: 0 0 32px 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-main);
}

.steam-token-circle {
  position: relative;
  width: 280px;
  height: 280px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.steam-token-ring {
  width: 280px;
  height: 280px;
  transform: rotate(-90deg);
  filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.06));
}

.steam-ring-bg {
  fill: none;
  stroke: var(--bg-input);
  stroke-width: 8;
}

.steam-ring-fg {
  fill: none;
  stroke: url(#steam-ring-gradient);
  stroke-width: 8;
  stroke-linecap: round;
  stroke-dasharray: 691 691;
  stroke-dashoffset: 691;
  opacity: 0;
  transition: stroke-dashoffset 50ms linear, opacity 0.3s;
}

.steam-token-inner {
  position: absolute;
  inset: 24px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-body);
  transition: transform 0.3s var(--ease-spring), box-shadow 0.3s;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
}

.steam-token-circle:hover .steam-token-inner {
  transform: scale(1.02);
  box-shadow: var(--shadow-md);
}

.steam-code-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.steam-code-text {
  font-family: var(--font-mono);
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 0.25em;
  margin-left: 0.25em;
  color: var(--text-main);
  transition: color 0.3s;
}

.steam-code-subtitle {
  margin-top: 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
}

.scroll-to-top {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg-surface);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-md);
  opacity: 0;
  transform: translateY(16px);
  transition: all 0.4s var(--ease-spring);
  z-index: 100;
}

.scroll-to-top.visible {
  opacity: 1;
  transform: translateY(0);
}

.scroll-to-top:hover {
  background: var(--bg-input);
  transform: translateY(-3px);
}

.kbd {
  display: inline-block;
  padding: 2px 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  border: 1px solid var(--border-color);
  border-radius: 4px;
  background: var(--bg-input);
  color: var(--text-secondary);
  margin-left: 8px;
  font-weight: 600;
}

@media (max-width: 768px) {
  .accounts-layout {
    grid-template-columns: 1fr;
  }

  .input-pill {
    min-width: 200px;
  }

  .kv-grid {
    grid-template-columns: 1fr;
  }

  .nav-menu {
    flex-direction: row;
    justify-content: space-around;
    width: 100%;
    margin: 0;
  }

  .nav-item {
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    font-size: 10px;
  }

  .nav-item span {
    display: block;
  }

  .nav-item.active {
    border: none;
    box-shadow: none;
    background: transparent;
    transform: scale(1.05);
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .control-bar {
    flex-direction: column;
    gap: 16px;
    align-items: stretch;
  }

  .control-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .field-row,
  .field-row--3,
  .field-row--4 {
    grid-template-columns: 1fr;
  }

  .payment-content {
    flex-direction: column;
  }

  .scroll-to-top {
    bottom: 90px;
  }
}

.gift-hero {
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--gradient-accent);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  margin-bottom: 24px;
  color: #fff;

  overflow: hidden;

}

.gift-hero::before {
  content: '';

  pointer-events: none;
}

.gift-hero-icon {
  width: 60px;
  height: 60px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: var(--radius-md);

  align-items: center;
  justify-content: center;
  flex-shrink: 0;

}

.gift-hero-text h2 {

}

.gift-hero-text p {

.gift-section {

.gift-section:hover {

}

.gift-section-header {

.gift-section-title {

.badge {

.gift-search-input {

.gift-loading {

.gift-spinner {

.gift-empty {

.gift-friends-grid {

.gift-friend-card {

.gift-editions-list {

}

}

.strategy-sim-results {

}

}

}

.strategy-module-row strong,

function formatMarketPriceAge(lastSuccessAt, nowMs = Date.now()) {
  if (lastSuccessAt == null || lastSuccessAt === "") return "";
  const successMs = Number(lastSuccessAt) * 1000;
  if (!Number.isFinite(successMs)) return "";
  const ageSeconds = Math.max(0, (Number(nowMs) - successMs) / 1000);
  if (ageSeconds < 60) return "<1m前";
  const minutes = Math.floor(ageSeconds / 60);
  if (ageSeconds < 3600) return `${minutes}m前`;
  const hours = Math.floor(ageSeconds / 3600);
  if (ageSeconds < 86400) return `${hours}h前`;
  const days = Math.floor(ageSeconds / 86400);
  if (days < 7) {
    const remainderHours = Math.floor((ageSeconds - days * 86400) / 3600);
    return remainderHours > 0 ? `${days}d${remainderHours}h前` : `${days}d前`;
  }
  return `${days}d前`;
}

  }

  const mode = force ? "force" : "normal";
  const query = force ? "?scope=holdings&force=1" : "?scope=holdings";
  holdingsPriceRefreshMode = mode;
  const operation = (async () => {
    try {
      const response = await fetchJson(API + "/market-prices" + query);
      await refreshTransactions({ reportError: false, rethrow: true });
      if (!force) return response;

      const attempted = [...new Set(Array.isArray(response.attempted) ? response.attempted : [])];
      const itemNames = Object.keys(response.items || {});
      if (!attempted.length && !itemNames.length) {
        toast("当前没有需要刷新的持有饰品");
        return response;
      }
      const succeeded = attempted.filter((name) => response.items?.[name]?.last_attempt_ok === true).length;
      const failed = attempted.length - succeeded;
      if (response.ok !== true || (attempted.length > 0 && succeeded === 0)) {
        const firstFailure = attempted
          .map((name) => response.items?.[name]?.last_error_message)
          .find(Boolean);
        const safeError = response.error || firstFailure || "Steam 双价格请求未成功";
        toast(`刷新 Steam 双价格失败：${safeError}`, "已保留上次成功价格");
        return response;
      }
      toast(`Steam 双价格刷新完成：请求 ${attempted.length} 种，成功 ${succeeded}，失败 ${failed}`);
      return response;
    } catch (error) {
      if (force) toast("刷新 Steam 双价格失败", error.message || "请求异常");
      return null;
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = button.dataset.holdingsPriceOriginalText || "刷新 Steam 双价格";
        delete button.dataset.holdingsPriceOriginalText;
      }
    }
  })();
  let managedPromise;
  managedPromise = operation.finally(() => {
    if (holdingsPriceRefreshPromise === managedPromise) {
      holdingsPriceRefreshPromise = null;
      holdingsPriceRefreshMode = null;
    }
  });
  holdingsPriceRefreshPromise = managedPromise;
  return managedPromise;
}

function holdingPlatformPriceText(value) {
  const numeric = Number(value);
  return Number.isFinite(numeric) && numeric > 0 ? `¥${numeric.toFixed(2)}` : "—";
}

function holdingPlatformCountText(value) {
  const numeric = Number(value);
  return Number.isFinite(numeric) && numeric >= 0 ? `${Math.trunc(numeric)} 单` : "—";
}

function holdingPlatformSourceText(value) {
  const source = String(value || "").trim();
  return ({
    steamdt_openapi: "SteamDT",
    csqaq: "CSQAQ",
    buff_direct: "BUFF 直连",
    yyyp_direct: "悠悠直连",
    c5_direct: "C5 直连",
    igxe_direct: "IGXE 直连",
    steam_direct: "Steam 直连",
  })[source] || source || "—";
}

function holdingPlatformUpdatedText(value) {
  if (value == null || value === "") return "";
  const raw = String(value).trim();
  const numeric = Number(raw);
  if (Number.isFinite(numeric) && numeric > 0) {
    const date = new Date(numeric > 1e11 ? numeric : numeric * 1000);
    if (Number.isFinite(date.getTime())) return date.toLocaleString("zh-CN", { hour12: false });
  }
  return raw;
}

const HOLDING_PRICE_PROVIDERS = [
  { code: "steamdt", label: "SteamDT" },
  { code: "csqaq", label: "CSQAQ" },
];
const HOLDING_PRICE_CONFLICT_TOLERANCE_PCT = 8;

function holdingProviderQuote(state, provider, platform) {
  const providers = state?.provider_quotes;
  const quote = providers?.[provider]?.[platform];
  return quote && typeof quote === "object" ? quote : null;
}

function holdingPriceComparison(state, platform) {
  const values = HOLDING_PRICE_PROVIDERS.map(({ code }) => {
    const quote = holdingProviderQuote(state, code, platform);
    const value = Number(quote?.sell_price);
    return Number.isFinite(value) && value > 0 ? { code, value } : null;
  }).filter(Boolean);
  if (values.length >= 2) {
    const highest = Math.max(...values.map((item) => item.value));
    const lowest = Math.min(...values.map((item) => item.value));
    const deltaPct = highest > 0 ? ((highest - lowest) / highest) * 100 : 0;
    return {
      status: deltaPct > HOLDING_PRICE_CONFLICT_TOLERANCE_PCT ? "conflict" : "cross_checked",
      deltaPct,
      values,
    };
  }
  if (values.length === 1) return { status: "single_source", deltaPct: null, values };
  const saved = state?.source_comparisons?.[platform];
  return saved && typeof saved === "object"
    ? { ...saved, values: [] }
    : { status: "unavailable", deltaPct: null, values: [] };
}

function holdingProviderStack(state, platform) {
  const providerDefinitions = [
    ...HOLDING_PRICE_PROVIDERS,
    ...Object.keys(state?.provider_quotes || {})
      .filter((code) => !HOLDING_PRICE_PROVIDERS.some((item) => item.code === code))
      .map((code) => ({ code, label: holdingPlatformSourceText(code) })),
  ];
  const rows = providerDefinitions.map(({ code, label }) => {
    const quote = holdingProviderQuote(state, code, platform);
    if (!quote) {
      return `<div class="market-detail-provider-row"><span>${escapeHtml(label)}</span><strong>未返回</strong></div>`;
    }
    const updated = holdingPlatformUpdatedText(quote.updated_at);
    const counts = [];
    if (quote.sell_count != null) counts.push(`${holdingPlatformCountText(quote.sell_count)}卖单`);
    if (quote.bidding_count != null) counts.push(`${holdingPlatformCountText(quote.bidding_count)}求购`);
    return `<div class="market-detail-provider-row">
      <span>${escapeHtml(label)}</span>
      <strong>卖 ${escapeHtml(holdingPlatformPriceText(quote.sell_price))} · 求 ${escapeHtml(holdingPlatformPriceText(quote.bidding_price))}</strong>
      ${counts.length || updated ? `<small>${escapeHtml(counts.join(" · "))}${counts.length && updated ? " · " : ""}${escapeHtml(updated)}</small>` : ""}
    </div>`;
  });
  return `<div class="market-detail-provider-stack">${rows.join("")}</div>`;
}

function holdingPlatformCard(state, code, label) {
  const quote = state.quotes?.[code] && typeof state.quotes[code] === "object"
    ? state.quotes[code]
    : {};
  const comparison = holdingPriceComparison(state, code);
  const hasQuote = Number(quote.sell_price) > 0 || Number(quote.bidding_price) > 0;
  const qualifies = Boolean(quote.qualified);
  const cardClass = comparison.status === "conflict"
    ? " market-detail-platform-card--conflict"
    : qualifies ? " market-detail-platform-card--hit" : "";
  const status = comparison.status === "conflict"
    ? "需核对"
    : qualifies
      ? "达标"
    : comparison.status === "cross_checked"
      ? "双源一致"
      : comparison.status === "single_source"
        ? "单源"
        : hasQuote ? "已返回" : "无报价";
  const deltaText = comparison.status === "conflict"
    ? `两源差异 ${Number(comparison.deltaPct || 0).toFixed(1)}%`
    : comparison.status === "cross_checked"
      ? `两源差异 ${Number(comparison.deltaPct || 0).toFixed(1)}%`
      : comparison.status === "single_source"
        ? "仅一个源返回卖价"
        : "";
  const source = holdingPlatformSourceText(quote.source);
  const updated = holdingPlatformUpdatedText(quote.updated_at);
  const snapshot = state.steam_snapshot && typeof state.steam_snapshot === "object"
    ? state.steam_snapshot
    : {};
  const smartReference = Number(snapshot.smart_reference_price);
  const sellPrice = Number(quote.sell_price);
  const estimatedDiscount = Number(quote.actual_discount) > 0
    ? Number(quote.actual_discount)
    : Number.isFinite(sellPrice) && sellPrice > 0 && Number.isFinite(smartReference) && smartReference > 0
      ? (sellPrice / smartReference) * 1.15
      : null;
  const ratioText = estimatedDiscount != null ? ` · 实际折扣估算 ${estimatedDiscount.toFixed(4)}` : "";
  return `<article class="market-detail-platform-card${cardClass}">
    <div class="market-detail-platform-head">
      <strong class="market-detail-platform-name">${escapeHtml(label)}</strong>
      <span class="market-detail-platform-state">${escapeHtml(status)}</span>
    </div>
    <div class="market-detail-platform-metrics">
      <div class="market-detail-metric">
        <span>最低出售价</span>
        <strong>${escapeHtml(holdingPlatformPriceText(quote.sell_price))}</strong>
      </div>
      <div class="market-detail-metric market-detail-metric--buy">
        <span>最高求购价</span>
        <strong>${escapeHtml(holdingPlatformPriceText(quote.bidding_price))}</strong>
      </div>
    </div>
    <div class="market-detail-platform-meta">卖单 ${escapeHtml(holdingPlatformCountText(quote.sell_count))} · 求购单 ${escapeHtml(holdingPlatformCountText(quote.bidding_count))}${source !== "—" ? ` · 采用 ${escapeHtml(source)}` : ""}${updated ? ` · ${escapeHtml(updated)}` : ""}${ratioText}</div>
    ${deltaText ? `<div class="market-detail-platform-meta">${escapeHtml(deltaText)}${comparison.status === "conflict" ? "，请点击来源核验" : ""}</div>` : ""}
    ${holdingProviderStack(state, code)}
  </article>`;
}

function holdingMarketHangdaoMetrics(state = {}) {
  const overview = state.market_overview && typeof state.market_overview === "object"
    ? state.market_overview
    : {};
  const quotes = state.quotes && typeof state.quotes === "object" ? state.quotes : {};
  const explicit = overview.hangdao && typeof overview.hangdao === "object" ? overview.hangdao : {};
  if (Object.keys(explicit).length && explicit.platforms && typeof explicit.platforms === "object") {
    return explicit;
  }

  const steamQuote = quotes.STEAM && typeof quotes.STEAM === "object" ? quotes.STEAM : {};
  const steamSnapshot = (overview.steam_snapshot && typeof overview.steam_snapshot === "object"
    ? overview.steam_snapshot
    : state.steam_snapshot && typeof state.steam_snapshot === "object"
      ? state.steam_snapshot
      : {});
  const steamSell = Number(steamQuote.sell_price) > 0
    ? holdingMarketOverviewNumber(steamQuote.sell_price)
    : holdingMarketOverviewNumber(steamSnapshot.steam_lowest_sell_price);
  const steamBuy = holdingMarketOverviewNumber(steamQuote.bidding_price);
  const receiptFactor = 0.869;
  let lowestPlatform = null;
  let lowestSell = null;
  const platforms = {};
  for (const { code } of HOLDINGS_PLATFORM_PRICE_DEFINITIONS) {
    const quote = quotes[code] && typeof quotes[code] === "object" ? quotes[code] : {};
    const sell = holdingMarketOverviewNumber(quote.sell_price);
    const buy = holdingMarketOverviewNumber(quote.bidding_price);
    if (sell != null && sell > 0 && (lowestSell == null || sell < lowestSell)) {
      lowestSell = sell;
      lowestPlatform = code;
    }
    const row = {
      sell_price: sell != null && sell > 0 ? sell : null,
      bidding_price: buy != null && buy > 0 ? buy : null,
      buy_order_cashout_ratio: buy != null && buy > 0 && steamSell > 0 ? buy / steamSell : null,
      sell_order_cashout_ratio: sell != null && sell > 0 && steamSell > 0 ? sell / steamSell : null,
    };
    if (Object.values(row).some((value) => value != null)) platforms[code] = row;
  }
  return {
    steam_receipt_factor: receiptFactor,
    steam_sell_price: steamSell,
    steam_buy_price: steamBuy,
    lowest_platform: lowestPlatform,
    lowest_platform_sell_price: lowestSell,
    steam_buy_hangdao_ratio: lowestSell != null && steamBuy > 0 ? lowestSell / (steamBuy * receiptFactor) : null,
    steam_sell_hangdao_ratio: lowestSell != null && steamSell > 0 ? lowestSell / (steamSell * receiptFactor) : null,
    platforms,
  };
}

        <tbody>${rows.map((row) => {
          const fields = holdingHistoryFields(row);
          return `<tr><td>${escapeHtml(holdingHistoryTime(fields.time))}</td><td class="market-detail-history-price">${escapeHtml(holdingHistoryPrice(fields.price))}</td><td>${escapeHtml(holdingHistoryVolume(fields.volume))}</td></tr>`;
        }).join("")}</tbody>
      </table></div>`
    : `<div class="market-detail-empty">${escapeHtml(history.error || "暂无历史行情数据")}</div>`;
  return `<section class="market-detail-section market-detail-history-section">
    <div class="market-detail-section-head">
      <span>STEAM HISTORY</span>
      <strong>历史行情 · 最近${rows.length || 10}条</strong>
      <small>原生历史优先，失败时显示备用源</small>
    </div>
    <div class="market-detail-history-meta">${meta}</div>
    ${history.error && rows.length ? `<div class="market-detail-history-note">${escapeHtml(history.error)}</div>` : ""}
    ${body}
  </section>`;
}

function renderHoldingRecentRecords(state = {}, options = {}) {
  if (!Array.isArray(state.recent_records)) return "";
  const publicSnapshot = options.publicSnapshot === true;
  const rows = state.recent_records.filter((row) => row && typeof row === "object").slice(0, 10);
  const body = rows.length
    ? `<div class="market-detail-recent-list">${rows.map((row) => {
        const rowName = row.name || row.market_hash_name || "未命名饰品";
        const rowId = row.id == null || row.id === "" ? "" : String(row.id);
        const currentRow = publicSnapshot && rowId && state.record_id != null
          && rowId === String(state.record_id);
        const detailButton = currentRow
          ? `<span class="market-detail-recent-unavailable">当前快照</span>`
          : publicSnapshot
            ? `<span class="market-detail-recent-unavailable">摘要</span>`
            : rowId
              ? `<button type="button" class="btn btn-sm btn-secondary market-detail-recent-open" data-market-detail-record-id="${escapeHtml(rowId)}">详情页</button>`
              : `<span class="market-detail-recent-unavailable">暂无详情</span>`;
        return `<article class="market-detail-recent-card">
          <div class="market-detail-recent-main">
            <span class="market-detail-recent-time">${escapeHtml(holdingHistoryTime(row.recorded_at))}${rowId ? ` · 快照 #${escapeHtml(rowId)}` : ""}</span>
            <strong class="market-detail-recent-name" title="${escapeHtml(rowName)}">${escapeHtml(rowName)}</strong>
            <span class="market-detail-recent-meta">${escapeHtml(holdingMarketPlatformLabel(row.best_platform))} · ${escapeHtml(holdingPlatformPriceText(row.best_price))} · 折扣 ${escapeHtml(row.best_discount == null ? "—" : Number(row.best_discount).toFixed(4))}</span>
          </div>
          <div class="market-detail-recent-result">${detailButton}</div>
        </article>`;
      }).join("")}</div>`

  return `<section class="market-detail-section market-detail-recent-section">
    <div class="market-detail-section-head">
      <span>PUSH HISTORY</span>
      <strong>最近10个命中饰品</strong>
      <small>最近10次命中记录 · 简洁列表</small>
