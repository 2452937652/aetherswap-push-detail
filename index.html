function renderHoldingHistoryAndRecords(state = {}, options = {}) {
  const history = renderHoldingHistory(state);
  const recent = renderHoldingRecentRecords(state, options);
  if (!history && !recent) return "";
  return `<div class="market-detail-history-layout">${history}${recent}</div>`;
}

function unifiedMarketItemFromRecord(record = {}) {
  if (record?.market_item && typeof record.market_item === "object") {
    return { ...record.market_item, record_id: record.id };
  }
  const overview = record?.market_overview && typeof record.market_overview === "object"
    ? record.market_overview
    : {};
  const quotes = {};
  for (const result of (record?.platform_results || [])) {
    if (result && result.platform) quotes[String(result.platform).toUpperCase()] = result;
  }
  const steamSnapshot = overview.steam_snapshot && typeof overview.steam_snapshot === "object"
    ? overview.steam_snapshot
    : {
      smart_reference_price: record.steam_reference_price,
      last_success_at: record.recorded_at,
      source: "legacy_strategy_snapshot",
    };
  return {
    market_hash_name: record.market_hash_name || record.name || "",
    goods_id: record.goods_id,
    quotes,
    provider_quotes: record.provider_quotes || {},
    source_status: overview.source_status || {},
    source_comparisons: overview.source_comparisons || {},
    market_overview: overview,
    steam_snapshot: steamSnapshot,
    history: overview.history || { status: "unavailable", rows: [], error: "该快照未记录历史行情" },
    recent_records: overview.recent_records || [],
    metrics: { actual_discount: record.best_discount },
    purchase_price: record.best_price,
    max_discount: record.max_discount,
    best_platform: record.best_platform,
    best_price: record.best_price,
    best_discount: record.best_discount,
    record_id: record.id,
  };
}

function renderUnifiedMarketDetail({ item = {}, transaction = {}, record = null, mode = "holding", options = {} } = {}) {
  const isHit = mode === "hit" || Boolean(record);
  const state = isHit ? unifiedMarketItemFromRecord(record || {}) : (item || {});
  const detailTransaction = isHit
    ? {
      name: record?.name || record?.market_hash_name || state.market_hash_name,
      market_hash_name: state.market_hash_name,
      goods_id: record?.goods_id ?? state.goods_id,
      price: record?.best_price ?? state.purchase_price,
    }
    : transaction;
  const analysis = record?.record_source === "manual" ? record.analysis : null;
  const analysisHtml = analysis ? `<section><h3>购入分析结果</h3><p>${escapeHtml(analysis.error || (analysis.final?.passed ? "通过" : analysis.final?.reject_reason || "数据不可用"))}</p>${(analysis.guards || []).map(guard => `<p>${escapeHtml(guard.status || "")} · ${escapeHtml(guard.reason || "")}</p>`).join("")}</section>` : "";
  return analysisHtml + renderHoldingPriceModalContent(
    detailTransaction,
    state,
    { ...options, mode: isHit ? "hit" : "holding", actions: options.actions ?? true },
  );
}

function renderHoldingPriceModalContent(transaction = {}, item = {}, options = {}) {
  const state = item && typeof item === "object" ? item : {};
  const quotes = state.quotes && typeof state.quotes === "object" ? state.quotes : {};
  const name = String(transaction.name || state.market_hash_name || "—");
  const marketName = String(state.market_hash_name || transaction.market_hash_name || name || "");
  const isHit = options.mode === "hit" || state.record_id != null;
  const providerStatus = state.provider_status && typeof state.provider_status === "object"
    ? state.provider_status
    : {};
  const hasConfiguredProvider = Object.keys(providerStatus).length === 0
    || Object.values(providerStatus).some((provider) => provider?.configured);
  const hasQuote = Object.values(quotes).some((quote) => {
    if (!quote || typeof quote !== "object") return false;
    return Number(quote.sell_price) > 0 || Number(quote.bidding_price) > 0;
  });
  const loading = options.loading || state.status === "loading";
  const statusMessage = loading
    ? "正在查询各平台最新报价…"
    : state.error
      ? String(state.error)
      : state.status === "not_configured" || !hasConfiguredProvider
        ? "尚未配置 SteamDT / CSQAQ 价格 API，报价暂时不可用。"
        : !hasQuote
          ? "暂未获取到有效报价，平台卡片会保留为空。"
          : "";
  const statusClass = state.error || state.status === "not_configured" || !hasConfiguredProvider
    ? " text-bad"
    : "";
  const snapshotAge = Number(state.fetched_at) > 0 ? formatMarketPriceAge(Number(state.fetched_at)) : "";
  const snapshotText = snapshotAge ? `更新于 ${snapshotAge}` : (loading ? "查询中" : "暂无快照");
  const purchasePrice = Number(transaction.price);
  const steamSnapshot = state.steam_snapshot && typeof state.steam_snapshot === "object"
    ? state.steam_snapshot
    : {};
  const steamSmartPrice = Number(steamSnapshot.smart_reference_price) > 0
    ? Number(steamSnapshot.smart_reference_price)
    : Number(transaction.current_market_price);
  const steamLowestPrice = Number(steamSnapshot.steam_lowest_sell_price) > 0
    ? Number(steamSnapshot.steam_lowest_sell_price)
    : Number(transaction.steam_lowest_sell_price);
  const steamState = Object.keys(steamSnapshot).length
    ? steamSnapshot
    : transaction.current_market_price_state || {};
  const assetid = transaction.assetid == null || transaction.assetid === "" ? "—" : transaction.assetid;
  const sellCandidates = [];
  const biddingCandidates = [];
  for (const { code, label } of HOLDINGS_PLATFORM_PRICE_DEFINITIONS) {
    const quote = quotes[code] && typeof quotes[code] === "object" ? quotes[code] : {};
    const sell = Number(quote.sell_price);
    const bidding = Number(quote.bidding_price);
    if (Number.isFinite(sell) && sell > 0) sellCandidates.push({ value: sell, label });
    if (Number.isFinite(bidding) && bidding > 0) biddingCandidates.push({ value: bidding, label });
  }
  const lowestSell = sellCandidates.sort((a, b) => a.value - b.value)[0];
  const highestBidding = biddingCandidates.sort((a, b) => b.value - a.value)[0];
  const summaryHtml = [
    ["Steam 智能参考价", Number.isFinite(steamSmartPrice) && steamSmartPrice > 0 ? holdingPlatformPriceText(steamSmartPrice) : "—", "accent"],
    ["Steam 当前最低卖价", Number.isFinite(steamLowestPrice) && steamLowestPrice > 0 ? holdingPlatformPriceText(steamLowestPrice) : "—", "accent"],
    ["全平台最低出售价", lowestSell ? `${holdingPlatformPriceText(lowestSell.value)} · ${lowestSell.label}` : "—", ""],
    ["全平台最高求购价", highestBidding ? `${holdingPlatformPriceText(highestBidding.value)} · ${highestBidding.label}` : "—", ""],
    ["购入价", Number.isFinite(purchasePrice) && purchasePrice > 0 ? holdingPlatformPriceText(purchasePrice) : "—", ""],
    ["报价快照", snapshotText, ""],
  ].map(([label, value, modifier]) => `
    <div class="market-detail-summary-card${modifier ? ` market-detail-summary-card--${modifier}` : ""}">
      <span>${escapeHtml(label)}</span>
      <strong>${escapeHtml(value)}</strong>
     </div>`).join("");
  const snapshotContextHtml = isHit
    ? `<section class="market-detail-section">
        <div class="market-detail-section-head">
          <span>SNAPSHOT CONTEXT</span>
          <strong>命中时商品信息</strong>
          <small>沿用当次策略快照，不重新计算</small>
        </div>
        <div class="market-detail-overview-stat-grid">
          <div class="market-detail-overview-stat"><span>候选价</span><strong>${escapeHtml(holdingPlatformPriceText(state.candidate_price))}</strong></div>
          <div class="market-detail-overview-stat"><span>候选折扣</span><strong>${escapeHtml(state.candidate_ratio == null ? "—" : Number(state.candidate_ratio).toFixed(4))}</strong></div>
          <div class="market-detail-overview-stat"><span>命中阈值</span><strong>${escapeHtml(state.max_discount == null ? "—" : `< ${Number(state.max_discount).toFixed(4)}`)}</strong></div>
          <div class="market-detail-overview-stat"><span>日成交量</span><strong>${escapeHtml(holdingPlatformCountText(state.daily_volume))}</strong></div>
        </div>
      </section>`
    : "";
  const conflictPlatforms = HOLDINGS_PLATFORM_PRICE_DEFINITIONS
    .map(({ code, label }) => ({ code, label, comparison: holdingPriceComparison(state, code) }))
    .filter((item) => item.comparison.status === "conflict");
  const dualSourcePlatforms = HOLDINGS_PLATFORM_PRICE_DEFINITIONS
    .map(({ code }) => holdingPriceComparison(state, code).status)
    .filter((status) => status === "cross_checked" || status === "conflict");
  const sourceStatusEntries = Object.entries(state.source_status || {})
    .filter(([, value]) => value && value.available === false && (value.error || value.reason));
  const sourceNote = conflictPlatforms.length
    ? `⚠ ${conflictPlatforms.map((item) => `${item.label}（${Number(item.comparison.deltaPct || 0).toFixed(1)}%）`).join("、")} 的 SteamDT / CSQAQ 卖价差异超过 ${HOLDING_PRICE_CONFLICT_TOLERANCE_PCT}%，该平台本轮不会自动判定为达标，请点击上方来源链接核对。`
    : dualSourcePlatforms.length
      ? `有 ${dualSourcePlatforms.length} 个平台同时返回 SteamDT / CSQAQ 卖价；出售价仅在两源差异不超过 ${HOLDING_PRICE_CONFLICT_TOLERANCE_PCT}% 时标记为双源一致。`
      : "当前只有一个价格源返回有效数据；出售价和求购价请以平台直达页最终核对。";
  const sourceNoteClass = conflictPlatforms.length ? " market-detail-source-note--warn" : "";
  const errorNote = sourceStatusEntries.length
    ? ` ${sourceStatusEntries.map(([provider, value]) => `${provider === "steamdt_openapi" ? "SteamDT" : provider === "csqaq" ? "CSQAQ" : provider}：${value.error || value.reason}`).join("；")}`
    : "";
  const busy = options.busy ? " disabled" : "";
  const pushRecordId = isHit && state.record_id != null && state.record_id !== ""
    ? ` data-push-record-id="${escapeHtml(state.record_id)}"`
    : "";
  const heroActions = options.actions === false ? "" : `
           ${isHit ? "" : `<button type="button" class="btn btn-sm btn-secondary" data-holding-price-refresh${busy}>重新查价</button>`}
           <button type="button" class="btn btn-sm btn-primary" data-holding-price-push${pushRecordId}${busy}>Push 到微信</button>`;
  return `
    <div class="holding-price-modal market-detail-shell">
      <div class="market-detail-hero">
        <div>
          <span class="market-detail-kicker">MARKET SNAPSHOT · ${isHit ? "HIT SNAPSHOT" : "LIVE QUOTES"}</span>
          <h4 class="market-detail-copyable">${escapeHtml(name)}</h4>
          <p class="market-detail-meta">${isHit ? "命中时不可变快照" : "最低卖单 / 最高买单"} · goods_id ${escapeHtml(transaction.goods_id ?? "—")} · assetid ${escapeHtml(assetid)}</p>
        </div>
        <div class="market-detail-hero-actions">
          ${heroActions}
        </div>
      </div>
      ${typeof renderMarketPlatformLinks === "function" ? renderMarketPlatformLinks({
        marketHashName: marketName,
        goodsId: transaction.goods_id,
        platformQuotes: quotes,
        providerQuotes: state.provider_quotes,
        links: state.links,
      }) : ""}
      <div class="market-detail-summary-grid">${summaryHtml}</div>
      ${snapshotContextHtml}
      ${renderHoldingDecisionMetrics(transaction, state)}
      ${renderHoldingMarketOverview(state)}
      <div class="market-detail-source-note${sourceNoteClass}" aria-live="polite">${escapeHtml(sourceNote)}${escapeHtml(errorNote)}</div>
      ${statusMessage ? `<div class="holding-price-modal-status${statusClass}" aria-live="polite">${escapeHtml(statusMessage)}</div>` : ""}
      <section class="market-detail-section">
        <div class="market-detail-section-head"><span>PLATFORM QUOTES</span><strong>国内平台报价</strong><small>红色/黄色提示代表需要重点核对</small></div>
        <div class="market-detail-platform-grid">
          ${HOLDINGS_PLATFORM_PRICE_DEFINITIONS.map(({ code, label }) => holdingPlatformCard(state, code, label)).join("")}
        </div>
      </section>
      ${renderHoldingHistoryAndRecords(state, options)}
    </div>`;
}

async function pushUnifiedMarketRecord(recordId, button) {
  if (recordId == null || recordId === "") return;
  const originalText = button?.textContent || "Push 到微信";
  if (button) {
    button.disabled = true;
    button.textContent = "推送中…";
  }
  try {
    const response = await fetchJson(`${API}/push-records/${encodeURIComponent(recordId)}/push`, {
      method: "POST",
    });
    if (response.ok !== true) throw new Error(response.error || "PushPlus 推送失败");
    toast(response.message || "已 Push 到微信");
  } catch (error) {
    toast("Push 失败", error.message || "请检查 PushPlus 配置");
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = originalText;
    }
  }
}

function bindUnifiedMarketDetailActions(host) {
  if (!host) return;
  host.addEventListener("click", (event) => {
    const historyButton = event.target.closest?.("[data-market-detail-record-id]");
    if (historyButton) {
      event.preventDefault();
      void openUnifiedMarketRecordDetail(historyButton.dataset.marketDetailRecordId);
      return;
    }
    const pushButton = event.target.closest?.("[data-holding-price-push]");
    if (pushButton && pushButton.dataset.pushRecordId) {
      event.preventDefault();
      void pushUnifiedMarketRecord(pushButton.dataset.pushRecordId, pushButton);
    }
  });
}

async function openUnifiedMarketRecordDetail(recordId) {
  if (recordId == null || recordId === "") return;
  try {
    const data = await fetchJson(`${API}/push-records/${encodeURIComponent(recordId)}`);
    if (!data?.ok || !data.record) throw new Error(data?.error || "详情加载失败");
    if (typeof appModal !== "function") throw new Error("详情弹窗组件未加载");
    appModal({
      title: data.record.record_source === "manual" ? "购入分析详情" : "折扣命中详情",
      content: renderUnifiedMarketDetail({
        record: data.record,
        mode: "hit",
        options: { actions: true },
      }),
      variant: "push-record",
      width: "1180px",
      autofocus: false,
      actions: [{ label: "关闭", value: false, kind: "secondary" }],
      onOpen(host) {
        bindUnifiedMarketDetailActions(host);
      },
    });
  } catch (error) {
    console.error("加载命中记录详情失败:", error);
    toast("详情加载失败", error.message || "请稍后重试");
  }
}

function applyHoldingPlatformPriceStates(states, providerStatus = {}, merge = false) {
  if (!states || typeof states !== "object") return;
  const normalized = merge ? { ...holdingPlatformPriceStates } : {};
  for (const [rawName, rawState] of Object.entries(states)) {
    const name = String(rawName || "").trim();
    if (!name || !rawState || typeof rawState !== "object") continue;
    normalized[name] = {
      ...rawState,
      provider_status: rawState.provider_status || providerStatus || {},
    };
  }
  holdingPlatformPriceStates = normalized;
  if (!lastEnrichData) return;
  for (const transaction of lastEnrichData) {
    if (transaction.type !== "purchase" || (transaction.sale_price != null && Number(transaction.sale_price) > 0)) continue;
    const name = String(transaction.name || "").trim();
    const state = normalized[name];
    if (!state) continue;
    transaction.platform_quotes = state.quotes || {};
    transaction.platform_price_state = state;
  }
}


async function refreshHoldingsPlatformPrices(force = false) {
  if (holdingsPlatformPriceRefreshInFlight) return;
  holdingsPlatformPriceRefreshInFlight = true;
  const requestGeneration = ++holdingsPlatformPriceRequestGeneration;
  const button = el("btn-refresh-holdings-platform-prices");
  if (button) button.disabled = true;
  try {
    const query = force ? "?force=1" : "";
    const response = await fetchJson(API + "/holdings-platform-prices" + query);
    if (response.ok === false) throw new Error(response.error || "多平台价格暂时不可用");
    if (requestGeneration !== holdingsPlatformPriceRequestGeneration) return;
    applyHoldingPlatformPriceStates(response.items || {}, response.provider_status || {});
    await refreshTransactions();
  } catch (e) {
    if (requestGeneration === holdingsPlatformPriceRequestGeneration && lastEnrichData) {
      const failedStates = {};
      for (const transaction of lastEnrichData) {
        if (transaction.type !== "purchase" || (transaction.sale_price != null && Number(transaction.sale_price) > 0)) continue;
        const name = String(transaction.name || "").trim();
        if (name) failedStates[name] = { status: "error", error: e.message || "" };
      }
      applyHoldingPlatformPriceStates(failedStates);
      await refreshTransactions();
    }
    toast("加载平台价格失败", e.message || "请稍后重试");
  } finally {
    holdingsPlatformPriceRefreshInFlight = false;
    if (button) button.disabled = false;
  }
}

async function fetchHoldingPlatformPrice(name, force = false) {
  const params = new URLSearchParams({ name });
  if (force) params.set("force", "1");
  const response = await fetchJson(API + "/holdings-platform-prices?" + params.toString());
  if (response.ok === false) throw new Error(response.error || "多平台价格暂时不可用");
  const item = response.items && response.items[name];
  if (!item) throw new Error("该饰品不在当前持有列表中，或暂未获取到报价");
  applyHoldingPlatformPriceStates({ [name]: item }, response.provider_status || {}, true);
  return holdingPlatformPriceStates[name] || item;
}

function openHoldingPriceModal(transaction) {
  const name = String(transaction?.name || "").trim();
  if (!name) return;
  let currentItem = holdingPlatformPriceStates[name] || {
    ...(transaction.platform_price_state || {}),
    market_hash_name: name,
    quotes: transaction.platform_quotes || transaction.platform_price_state?.quotes || {},
  };
  let busy = false;
  appModal({
    title: `查价 · ${name}`,
    variant: "holding-price",
    width: "1160px",
    autofocus: false,
    content: renderHoldingPriceModalContent(transaction, currentItem),
    actions: [{ label: "关闭", value: false, kind: "secondary" }],
    onOpen(host) {
      const contentBox = host.querySelector(".app-modal-content");
      const setContent = (item, options = {}) => {
        currentItem = item && typeof item === "object" ? item : {};
        if (contentBox) contentBox.innerHTML = renderHoldingPriceModalContent(transaction, currentItem, options);
      };
      const load = async (force = false) => {
        if (busy) return;
        busy = true;
        setContent({ ...currentItem, status: "loading" }, { busy: true, loading: true });
        try {
          const item = await fetchHoldingPlatformPrice(name, force);
          // The detail response was persisted first. Repaint every holding's
          // derived metrics from that same durable Steam state.
          await refreshTransactions({ reportError: false, rethrow: true });
          setContent(item, { busy: true });
        } catch (e) {
          setContent({ ...currentItem, status: "error", error: e.message || "查询失败" }, { busy: true });
          toast("查询平台价格失败", e.message || "请稍后重试");
        } finally {
          busy = false;
          setContent(currentItem, { busy: false });
        }
      };
      const push = async (button) => {
        if (busy) return;
        busy = true;
        button.disabled = true;
        button.textContent = "推送中…";
        try {
          const response = await fetchJson(API + "/holdings-platform-prices/push", {
            method: "POST",
            body: JSON.stringify({ market_hash_name: name }),
          });
          if (response.ok !== true) throw new Error(response.error || "PushPlus 推送失败");
          toast(response.message || "已 Push 到微信");
        } catch (e) {
          toast("Push 失败", e.message || "请检查 PushPlus 配置");
        } finally {
          busy = false;
          const currentButton = host.querySelector("[data-holding-price-push]");
          if (currentButton) {
            currentButton.disabled = false;
            currentButton.textContent = "Push 到微信";
          }
        }
      };
      host.addEventListener("click", (event) => {
        const historyButton = event.target.closest?.("[data-market-detail-record-id]");
        if (historyButton) {
          event.preventDefault();
          void openUnifiedMarketRecordDetail(historyButton.dataset.marketDetailRecordId);
          return;
        }
        const refreshButton = event.target.closest("[data-holding-price-refresh]");
        if (refreshButton) {
          event.preventDefault();
          void load(true);
          return;
        }
        const pushButton = event.target.closest("[data-holding-price-push]");
        if (pushButton) {
          event.preventDefault();
          void push(pushButton);
        }
      });
      void load(true);
    },
  });
}

function renderTxTable(tbody, list, isPurchase = false, resellRatio = 0.85, multiSelectMode = false) {
  const rowHtmls = [];
  for (const t of list) {
    const at = t.at ? new Date(t.at * 1000) : null;
    const timeStr = at ? `${at.getFullYear()}-${String(at.getMonth() + 1).padStart(2, "0")}-${String(at.getDate()).padStart(2, "0")} ${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}:${String(at.getSeconds()).padStart(2, "0")}` : "—";
    const nameText = (t.name || "—").toString();
    const idx = t.idx;
    const type = t.type;
    const notFound = isPurchase && t.ownership_status === "not_found";
    const notFoundBadge = notFound
      ? `<span class="holding-not-found-badge" title="最近一次完整对账未在 Steam 库存、在售列表和已售记录中找到；请确认后删除本地记录">Steam库存未找到</span>`
      : "";
    const priceCheckButton = isPurchase
      ? `<button type="button" class="holding-price-check-btn tx-btn-price" data-type="${escapeHtml(type)}" data-idx="${idx}" title="查看各平台最低出售价和最高求购价" aria-label="查询 ${escapeHtml(nameText)} 价格">查价</button>`
      : "";
    const nameCell = `<span class="holding-name-cell">${priceCheckButton}<span class="holding-name-text">${escapeHtml(nameText)}</span>${notFoundBadge}</span>`;
    const rowClass = notFound ? ` class="holding-row-not-found"` : "";
    const actHtml = isPurchase
      ? (multiSelectMode
        ? `<button type="button" class="btn btn-sm btn-edit tx-btn-edit" data-type="${escapeHtml(type)}" data-idx="${idx}">编辑</button>`
        : `<button type="button" class="btn btn-sm btn-edit tx-btn-edit" data-type="${escapeHtml(type)}" data-idx="${idx}">编辑</button> <button type="button" class="btn btn-sm btn-primary tx-btn-sell" data-type="${escapeHtml(type)}" data-idx="${idx}">售出</button> <button type="button" class="btn btn-sm btn-danger-outline tx-btn-del" data-type="${escapeHtml(type)}" data-idx="${idx}">删除</button>`)
      : `<button type="button" class="btn btn-sm btn-edit tx-btn-edit" data-type="${escapeHtml(type)}" data-idx="${idx}">编辑</button> <button type="button" class="btn btn-sm btn-danger-outline tx-btn-del" data-type="${escapeHtml(type)}" data-idx="${idx}">删除</button>`;
    const checkCell = isPurchase && multiSelectMode ? `<td class="holding-select-cell"><input type="checkbox" class="holding-checkbox" data-idx="${idx}" data-db-id="${Number(t.db_id) || 0}" /></td>` : "";
    const priceCell = `<td class="mono">${escapeHtml(Number(t.price).toFixed(2))}</td>`;
    if (isPurchase) {
      const mp = t.market_price != null ? Number(t.market_price).toFixed(2) : "—";
      // ``current_market_price`` is the smart reference price.  Keep the
      // raw Steam lowest sell order separate and out of all strategy math.
      const cur = t.current_market_price != null ? Number(t.current_market_price) : null;
      const lowestSell = t.steam_lowest_sell_price != null ? Number(t.steam_lowest_sell_price) : null;
      const priceState = t.current_market_price_state || {};
      const cmpDisplay = marketPriceDisplay(cur, priceState);
      const cmp = cmpDisplay.text;
      const lowestDisplay = steamLowestPriceDisplay(lowestSell, priceState);
      const lowestCmp = lowestDisplay.text;
      const marketAtBuy = t.market_price != null ? Number(t.market_price) : null;
      let plCell = "<td></td>";
      // Current valuation follows Steam's raw lowest sell order.  The smart
      // reference remains the sole input to the actual-discount calculation.
      const valuationPrice = lowestSell != null && lowestSell > 0 ? lowestSell : null;
      if (valuationPrice != null && marketAtBuy != null && marketAtBuy > 0) {
        const diff = valuationPrice - marketAtBuy;
        const pct = ((diff / marketAtBuy) * 100).toFixed(2) + "%";
        const cls = diff > 0 ? "text-ok" : diff < 0 ? "text-bad" : "";
        plCell = `<td class="mono ${cls}">${diff >= 0 ? "+" : ""}${diff.toFixed(2)} (${diff >= 0 ? "+" : ""}${pct})</td>`;
      }
      const cost = Number(t.price) || 0;
      const valuationAfterTax = t.price_metrics ? t.price_metrics.after_tax_price : (valuationPrice != null ? valuationPrice / 1.15 : null);
      const smartAfterTax = cur != null && cur > 0 ? cur / 1.15 : null;
      const afterTax = valuationAfterTax != null ? valuationAfterTax.toFixed(2) : "";
      const discountRatioValue = t.price_metrics ? t.price_metrics.actual_discount : (smartAfterTax != null && smartAfterTax > 0 && cost > 0 ? cost / smartAfterTax : null);
      const discountRatio = discountRatioValue != null ? discountRatioValue.toFixed(4) : "";
      const discountRatioClass = discountRatioValue != null
        ? (discountRatioValue > HOLDING_ACTUAL_DISCOUNT_RED_THRESHOLD ? "text-bad" : "text-ok")
        : "";
      const selfUseProfitValue = t.price_metrics ? t.price_metrics.self_use_profit : (valuationAfterTax != null && cost > 0 ? valuationAfterTax * SELF_USE_PROFIT_RATIO - cost : null);
      const cashProfitValue = t.price_metrics ? t.price_metrics.cash_profit : (valuationAfterTax != null && cost > 0 ? valuationAfterTax * CASH_PROFIT_RATIO - cost : null);
      const relativeProfitValue = t.price_metrics ? t.price_metrics.relative_profit : (valuationAfterTax != null && cost > 0 ? valuationAfterTax * RELATIVE_PROFIT_RATIO - cost : null);
      const selfUseProfit = selfUseProfitValue != null ? selfUseProfitValue.toFixed(2) : "";
      const cashProfit = cashProfitValue != null ? cashProfitValue.toFixed(2) : "";
      const relativeProfit = relativeProfitValue != null ? relativeProfitValue.toFixed(2) : "";
      const selfUseClass = selfUseProfitValue != null ? (selfUseProfitValue > 0 ? "text-ok" : selfUseProfitValue < 0 ? "text-bad" : "") : "";
      const cashProfitClass = cashProfitValue != null ? (cashProfitValue > 0 ? "text-ok" : cashProfitValue < 0 ? "text-bad" : "") : "";
      const relativeProfitClass = relativeProfitValue != null ? (relativeProfitValue > 0 ? "text-ok" : relativeProfitValue < 0 ? "text-bad" : "") : "";
      const afterTaxCell = afterTax ? `<td class="mono">${escapeHtml(afterTax)}</td>` : "<td></td>";
      const discountRatioCell = discountRatio ? `<td class="mono ${discountRatioClass}">${escapeHtml(discountRatio)}</td>` : "<td></td>";
      const selfUseCell = selfUseProfit ? `<td class="mono ${selfUseClass}">${escapeHtml(parseFloat(selfUseProfit) >= 0 ? "+" + selfUseProfit : selfUseProfit)}</td>` : "<td></td>";
      const cashProfitCell = cashProfit ? `<td class="mono ${cashProfitClass}">${escapeHtml(parseFloat(cashProfit) >= 0 ? "+" + cashProfit : cashProfit)}</td>` : "<td></td>";
      const relativeProfitCell = relativeProfit ? `<td class="mono ${relativeProfitClass}">${escapeHtml(parseFloat(relativeProfit) >= 0 ? "+" + relativeProfit : relativeProfit)}</td>` : "<td></td>";
      const assetidCell = `<td class="mono">${escapeHtml(t.assetid ?? "—")}</td>`;
      const cmpClass = cmpDisplay.failed ? "text-bad market-price-failed" : "";
      const lowestClass = lowestDisplay.failed ? "text-bad market-price-failed" : "";
      rowHtmls.push(`<tr${rowClass}>${checkCell}<td class="mono">${escapeHtml(timeStr)}</td><td>${nameCell}</td>${assetidCell}${priceCell}<td class="mono">${escapeHtml(mp)}</td><td class="mono ${cmpClass}" data-market-price-cell title="用于买入、折扣和策略判断">${escapeHtml(cmp)}</td><td class="mono ${lowestClass}" data-steam-lowest-sell-cell title="Steam 当前最低卖单，仅用于展示和估值">${escapeHtml(lowestCmp)}</td>${afterTaxCell}${discountRatioCell}${selfUseCell}${cashProfitCell}${relativeProfitCell}${plCell}<td class="tx-actions">${actHtml}</td></tr>`);
    } else {
      const assetidCell = `<td class="mono">${escapeHtml(t.assetid ?? "—")}</td>`;
      rowHtmls.push(`<tr${rowClass}>${checkCell}<td class="mono">${escapeHtml(timeStr)}</td><td>${nameCell}</td>${assetidCell}${priceCell}<td class="tx-actions">${actHtml}</td></tr>`);
    }
  }
  tbody.innerHTML = rowHtmls.join("");
  tbody.querySelectorAll(".tx-btn-del").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!(await appConfirm("确定删除这条记录？", { title: "删除记录", danger: true, confirmText: "删除" }))) return;
      const type = btn.dataset.type;
      const idx = parseInt(btn.dataset.idx, 10);
      try {
        const r = await fetchJson(API + "/transaction?" + new URLSearchParams({ type, idx }), { method: "DELETE" });
        if (r.ok) {
          toast("已删除");
          refreshTransactions();
        } else {
          toast("删除失败", r.error || "");
        }
      } catch (e) {
        toast("删除失败", e.message || "");
      }
    });
  });
  tbody.querySelectorAll(".tx-btn-edit").forEach(btn => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.type;
      const idx = parseInt(btn.dataset.idx, 10);
      const t = list.find(x => x.type === type && x.idx === idx);
      if (!t) return;
      el("edit-tx-name").value = t.name || "";
      el("edit-tx-price").value = t.price ?? "";
      el("edit-tx-goods-id").value = t.goods_id ?? "";
      const mpWrap = el("edit-tx-market-price-wrap");
      if (mpWrap) mpWrap.style.display = type === "purchase" ? "" : "none";
      const mpEl = el("edit-tx-market-price");
      if (mpEl) mpEl.value = type === "purchase" ? (t.market_price ?? "") : "";
      const assetidWrap = el("edit-tx-assetid-wrap");
      if (assetidWrap) assetidWrap.style.display = type === "purchase" ? "" : "none";
      const assetidEl = el("edit-tx-assetid");
      if (assetidEl) assetidEl.value = type === "purchase" ? (t.assetid ?? "") : "";
      const listingWrap = el("edit-tx-listing-wrap");
      if (listingWrap) listingWrap.style.display = type === "purchase" ? "" : "none";
      const listingEl = el("edit-tx-listing");
      if (listingEl) {
        if (type !== "purchase") listingEl.value = "0";
        else if (t.pending_receipt) listingEl.value = "2";
        else if (t.listing) listingEl.value = "1";
        else listingEl.value = "0";
      }
      el("edit-tx-overlay").dataset.editType = type;
      el("edit-tx-overlay").dataset.editIdx = String(idx);
      el("edit-tx-overlay").classList.remove("hidden");
    });
  });
  tbody.querySelectorAll(".tx-btn-sell").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const t = list.find(x => x.type === "purchase" && x.idx === idx);
      if (!t) return;
      const nameEl = el("sell-tx-item-name");
      if (nameEl) nameEl.textContent = t.name || "—";
      el("sell-tx-overlay").dataset.sellIdx = String(idx);
      const priceEl = el("sell-tx-price");
      if (priceEl) priceEl.value = "";
      el("sell-tx-overlay").classList.remove("hidden");
      if (priceEl) priceEl.focus();
    });
  });
  tbody.querySelectorAll(".tx-btn-price").forEach(btn => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.type;
      const idx = parseInt(btn.dataset.idx, 10);
      const transaction = list.find((item) => item.type === type && item.idx === idx);
      if (transaction) openHoldingPriceModal(transaction);
    });
  });
}
function renderPurchaseHistoryTable(tbody, list, resellRatio = 0.85, multiSelectMode = false) {
  const ratio = Math.max(0.01, Math.min(1, Number(resellRatio) || 0.85));
  const sorted = list.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
  const rowHtmls = [];
  for (const t of sorted) {
    const at = t.at ? new Date(t.at * 1000) : null;
    const timeStr = at ? `${at.getFullYear()}-${String(at.getMonth() + 1).padStart(2, "0")}-${String(at.getDate()).padStart(2, "0")} ${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}:${String(at.getSeconds()).padStart(2, "0")}` : "—";
    const nameText = (t.name || "—").toString();
    const idx = t.idx;
    const checkCell = multiSelectMode ? `<td class="holding-select-cell"><input type="checkbox" class="history-checkbox" data-idx="${idx}" data-db-id="${Number(t.db_id) || 0}" /></td>` : "";
    const cost = Number(t.price) || 0;
    const mp = t.market_price != null ? Number(t.market_price).toFixed(2) : "—";
    const sold = t.sale_price != null && Number(t.sale_price) > 0;
    const notFound = t.ownership_status === "not_found";
    const listingError = t.listing_status === "error";
    const statusStr = t.pending_receipt ? "待收货" : sold ? "已出售" : notFound ? "Steam库存未找到" : listingError ? "ERROR" : t.listing ? "出售中" : "持有中";
    const statusCellClass = t.pending_receipt ? "status-pending" : sold ? "status-sold" : notFound ? "status-not-found" : listingError ? "status-error" : t.listing ? "status-listing" : "status-holding";
    const salePriceStr = sold ? Number(t.sale_price).toFixed(2) : "—";
    let discountRatioStr = "—", selfUseProfitStr = "—", cashProfitStr = "—", relativeProfitStr = "—", discountRatioClass = "";
    let selfUseProfitValue = null, cashProfitValue = null, relativeProfitValue = null;
    if (sold) {
      const afterTax = Number(t.sale_price) / 1.15;
      discountRatioStr = afterTax > 0 && cost > 0 ? (cost / afterTax).toFixed(4) : "—";
      discountRatioClass = discountRatioStr !== "—" ? (parseFloat(discountRatioStr) > ratio ? "text-bad" : "text-ok") : "";
      if (afterTax > 0) {
        selfUseProfitValue = afterTax * SELF_USE_PROFIT_RATIO - cost;
        cashProfitValue = afterTax * CASH_PROFIT_RATIO - cost;
        relativeProfitValue = afterTax * RELATIVE_PROFIT_RATIO - cost;
        selfUseProfitStr = (selfUseProfitValue >= 0 ? "+" : "") + selfUseProfitValue.toFixed(2);
        cashProfitStr = (cashProfitValue >= 0 ? "+" : "") + cashProfitValue.toFixed(2);
        relativeProfitStr = (relativeProfitValue >= 0 ? "+" : "") + relativeProfitValue.toFixed(2);
      }
    }
    const selfUseClass = selfUseProfitValue != null ? (selfUseProfitValue > 0 ? "text-ok" : selfUseProfitValue < 0 ? "text-bad" : "") : "";
    const cashClass = cashProfitValue != null ? (cashProfitValue > 0 ? "text-ok" : cashProfitValue < 0 ? "text-bad" : "") : "";
    const relativeClass = relativeProfitValue != null ? (relativeProfitValue > 0 ? "text-ok" : relativeProfitValue < 0 ? "text-bad" : "") : "";
    let deviationCell = "<td></td>";
    if (sold) {
      const marketAtBuy = t.market_price != null ? Number(t.market_price) : 0;
      const saleP = Number(t.sale_price) || 0;
      if (marketAtBuy > 0) {
        const diff = saleP - marketAtBuy;
        const pct = ((diff / marketAtBuy) * 100).toFixed(2) + "%";
        const devClass = diff > 0 ? "text-ok" : diff < 0 ? "text-bad" : "";
        deviationCell = `<td class="mono ${devClass}">${diff >= 0 ? "+" : ""}${diff.toFixed(2)} (${diff >= 0 ? "+" : ""}${pct})</td>`;
      } else {
        deviationCell = `<td class="mono">—</td>`;
      }
    } else {
      deviationCell = `<td class="mono">—</td>`;
    }
    const dbId = Number(t.db_id) || 0;
    const delistBtn = !multiSelectMode && t.listing ? `<button type="button" class="btn btn-sm btn-warning-outline ph-btn-delist" data-type="purchase" data-idx="${idx}" data-db-id="${dbId}">下架</button> ` : "";
    const actHtml = !multiSelectMode ? (delistBtn + `<button type="button" class="btn btn-sm btn-danger-outline ph-btn-del" data-type="purchase" data-idx="${idx}">删除</button>`) : "";
    const assetidStr = t.assetid ?? "—";
    rowHtmls.push(`<tr${notFound ? ` class="holding-row-not-found"` : ""}>${checkCell}<td class="mono">${escapeHtml(timeStr)}</td><td>${escapeHtml(nameText)}</td><td class="mono">${escapeHtml(assetidStr)}</td><td class="mono">${escapeHtml(Number(t.price).toFixed(2))}</td><td class="mono">${escapeHtml(mp)}</td><td class="status-cell ${statusCellClass}" title="${notFound ? "最近一次完整对账未在 Steam 库存、在售列表和已售记录中找到；请确认后删除本地记录" : ""}">${escapeHtml(statusStr)}</td><td class="mono">${escapeHtml(salePriceStr)}</td><td class="mono ${discountRatioClass}">${escapeHtml(discountRatioStr)}</td><td class="mono ${selfUseClass}">${escapeHtml(selfUseProfitStr)}</td><td class="mono ${cashClass}">${escapeHtml(cashProfitStr)}</td><td class="mono ${relativeClass}">${escapeHtml(relativeProfitStr)}</td>${deviationCell}<td class="tx-actions">${actHtml}</td></tr>`);
  }
  tbody.innerHTML = rowHtmls.join("");
  tbody.querySelectorAll(".ph-btn-delist").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!(await appConfirm("确定下架该饰品？下架后 assetid 会变更。", { title: "下架饰品", confirmText: "下架" }))) return;
      const idx = parseInt(btn.dataset.idx, 10);
      btn.disabled = true;
      toast("下架中", "请稍候…");
      try {
        const dbId = parseInt(btn.dataset.dbId, 10) || 0;
        const query = dbId ? "?" + new URLSearchParams({ db_id: dbId }) : "";
        const r = await fetchJson(API + "/purchase/" + idx + "/delist" + query, { method: "POST" });
        if (r.ok) {
          const assetDetail = r.assetid != null && r.assetid !== "" ? "新 assetid: " + r.assetid : "新 assetid 为空，请使用「同步售出/持有」补全";
          const detail = [assetDetail, r.warning || r.message || ""].filter(Boolean).join("；");
          toast("下架成功", detail);
          refreshTransactions();
          refreshStatus();
        } else {
          toast("下架失败", r.error || "接口未返回 error 字段");
        }
      } catch (e) {
        toast("下架失败", e.message || "请求异常");
      } finally {
        btn.disabled = false;
      }
    });
  });
  tbody.querySelectorAll(".ph-btn-del").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!(await appConfirm("确定删除这条记录？删除后将从持有饰品与操作记录中同时移除。", { title: "删除持有记录", danger: true, confirmText: "删除" }))) return;
      const idx = parseInt(btn.dataset.idx, 10);
      try {
        const r = await fetchJson(API + "/transaction?" + new URLSearchParams({ type: "purchase", idx }), { method: "DELETE" });
        if (r.ok) {
          toast("已删除");
          refreshTransactions();
        } else {
          toast("删除失败", r.error || "");
        }
      } catch (e) {
        toast("删除失败", e.message || "");
      }
    });
  });
}
function applyTransactionsToUI(all, summaryEl, tbodyP, tbodyS, tbodyHistory, resellRatio = 0.85) {
  const purchases = all.filter((t) => t.type === "purchase");
  const holdings = purchases.filter((t) => !(t.sale_price != null && Number(t.sale_price) > 0));
  const sales = all.filter((t) => t.type === "sale");
  const ratio = Math.max(0.01, Math.min(1, Number(resellRatio) || 0.85));
  if (tbodyP) renderTxTable(tbodyP, holdings, true, ratio, holdingsMultiSelectMode);
  if (tbodyHistory) renderPurchaseHistoryTable(tbodyHistory, purchases, ratio, historyMultiSelectMode);
  syncHistoryMultiSelectUI();
  const historySummaryEl = el("purchase-history-summary");
  if (historySummaryEl && purchases.length) {
    const totalPrice = purchases.reduce((s, t) => s + (Number(t.price) || 0), 0);
    const totalMp = purchases.reduce((s, t) => s + (t.market_price != null ? Number(t.market_price) : 0), 0);
    const totalSalePrice = purchases.reduce((s, t) => s + (t.sale_price != null && Number(t.sale_price) > 0 ? Number(t.sale_price) : 0), 0);
    const totalAfterTax = totalSalePrice > 0 ? totalSalePrice / 1.15 : null;
    const soldItems = purchases.filter((t) => t.sale_price != null && Number(t.sale_price) > 0);
    let ratioSum = 0, ratioCount = 0, totalSelfUseProfit = 0, totalCashProfit = 0, totalRelativeProfit = 0;
    soldItems.forEach((t) => {
      const afterTax = Number(t.sale_price) / 1.15;
      const cost = Number(t.price) || 0;
      if (afterTax > 0 && cost > 0) { ratioSum += cost / afterTax; ratioCount += 1; }
      totalSelfUseProfit += afterTax * SELF_USE_PROFIT_RATIO - cost;
      totalCashProfit += afterTax * CASH_PROFIT_RATIO - cost;
      totalRelativeProfit += afterTax * RELATIVE_PROFIT_RATIO - cost;
    });
    const discountRatio = ratioCount > 0 ? (ratioSum / ratioCount).toFixed(4) : "—";
    const discountRatioClass = discountRatio !== "—" ? (parseFloat(discountRatio) > ratio ? "text-bad" : "text-ok") : "";
    const selfUseProfitVal = soldItems.length > 0 ? totalSelfUseProfit : null;
    const cashProfitVal = soldItems.length > 0 ? totalCashProfit : null;
    const relativeProfitVal = soldItems.length > 0 ? totalRelativeProfit : null;
    const selfUseClass = selfUseProfitVal != null && selfUseProfitVal > 0 ? "text-ok" : selfUseProfitVal != null && selfUseProfitVal < 0 ? "text-bad" : "";
    const cashProfitClass = cashProfitVal != null && cashProfitVal > 0 ? "text-ok" : cashProfitVal != null && cashProfitVal < 0 ? "text-bad" : "";
    const relativeProfitClass = relativeProfitVal != null && relativeProfitVal > 0 ? "text-ok" : relativeProfitVal != null && relativeProfitVal < 0 ? "text-bad" : "";
    const soldMp = purchases.reduce((s, t) => s + (t.sale_price != null && Number(t.sale_price) > 0 && t.market_price != null ? Number(t.market_price) : 0), 0);
    const totalDeviation = totalSalePrice > 0 && soldMp > 0 ? totalSalePrice - soldMp : null;
    const totalDeviationPct = totalDeviation != null && soldMp > 0 ? ((totalDeviation / soldMp) * 100).toFixed(2) + "%" : "—";
    const deviationClass = totalDeviation != null && totalDeviation > 0 ? "text-ok" : totalDeviation != null && totalDeviation < 0 ? "text-bad" : "";
    const deviationStr = totalDeviation != null ? `${totalDeviation >= 0 ? "+" : ""}${totalDeviation.toFixed(2)} (${totalDeviation >= 0 ? "+" : ""}${totalDeviationPct})` : "—";
    const salePriceStr = totalSalePrice > 0 ? totalSalePrice.toFixed(2) : "—";
    const afterTaxStr = totalAfterTax != null ? totalAfterTax.toFixed(2) : "—";
    const cashProfitStr = cashProfitVal != null ? (cashProfitVal >= 0 ? "+" : "") + cashProfitVal.toFixed(2) : "—";
    const selfUseProfitStr = selfUseProfitVal != null ? (selfUseProfitVal >= 0 ? "+" : "") + selfUseProfitVal.toFixed(2) : "—";
    const relativeProfitStr = relativeProfitVal != null ? (relativeProfitVal >= 0 ? "+" : "") + relativeProfitVal.toFixed(2) : "—";
    historySummaryEl.innerHTML = [
      `<span class="summary-stat"><span class="summary-label">总购入价</span><span class="summary-value mono">${totalPrice.toFixed(2)}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总购入时 Steam 智能参考价</span><span class="summary-value mono">${totalMp.toFixed(2)}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总出售价</span><span class="summary-value mono">${salePriceStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总税后价格</span><span class="summary-value mono">${afterTaxStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">实际折扣比率</span><span class="summary-value mono ${discountRatioClass}">${discountRatio}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总自用收益（×0.75）</span><span class="summary-value mono ${selfUseClass}">${selfUseProfitStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总变现收益（×0.8）</span><span class="summary-value mono ${cashProfitClass}">${cashProfitStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总相对收益（×1）</span><span class="summary-value mono ${relativeProfitClass}">${relativeProfitStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总价格偏离度</span><span class="summary-value mono ${deviationClass}">${deviationStr}</span></span>`,
    ].join("");
    historySummaryEl.style.display = "";
  } else if (historySummaryEl) {
    historySummaryEl.textContent = "";
    historySummaryEl.style.display = "none";
  }
  if (summaryEl && holdings.length) {
    const totalPrice = holdings.reduce((s, t) => s + (Number(t.price) || 0), 0);
    const totalMp = holdings.reduce((s, t) => s + (t.market_price != null ? Number(t.market_price) : 0), 0);
    const hasAnyCmp = holdings.some((t) => t.current_market_price != null);
    const totalCmp = hasAnyCmp ? holdings.reduce((s, t) => s + (t.current_market_price != null ? Number(t.current_market_price) : 0), 0) : null;
    const hasAnyLowest = holdings.some((t) => t.steam_lowest_sell_price != null);
    const totalLowest = hasAnyLowest
      ? holdings.reduce((s, t) => s + (t.steam_lowest_sell_price != null ? Number(t.steam_lowest_sell_price) : 0), 0)
      : null;
    const marketChangeTotals = holdings.reduce((acc, t) => {
      const cmp = t.steam_lowest_sell_price != null ? Number(t.steam_lowest_sell_price) : null;
      const mp = t.market_price != null ? Number(t.market_price) : null;
      if (cmp != null && Number.isFinite(cmp) && mp != null && Number.isFinite(mp) && mp > 0) {
        acc.current += cmp;
        acc.purchase += mp;
        acc.count += 1;
      }
      return acc;
    }, { current: 0, purchase: 0, count: 0 });
    const totalPl = marketChangeTotals.count > 0 ? marketChangeTotals.current - marketChangeTotals.purchase : null;
    const totalPlPct = totalPl != null && marketChangeTotals.purchase > 0 ? ((totalPl / marketChangeTotals.purchase) * 100).toFixed(2) + "%" : "—";
    const plClass = totalPl != null && totalPl > 0 ? "text-ok" : totalPl != null && totalPl < 0 ? "text-bad" : "";
    const cmpStr = totalCmp != null ? totalCmp.toFixed(2) : "—";
    const lowestStr = totalLowest != null ? totalLowest.toFixed(2) : "—";
    const plStr = totalPl != null ? `${totalPl >= 0 ? "+" : ""}${totalPl.toFixed(2)} (${totalPl >= 0 ? "+" : ""}${totalPlPct})` : "—";
    const totalAfterTax = totalLowest != null && totalLowest > 0 ? totalLowest / 1.15 : null;
    const afterTaxStr = totalAfterTax != null ? totalAfterTax.toFixed(2) : "—";
    let ratioSum = 0, ratioCount = 0, valuationCount = 0, totalSelfUseProfit = 0, totalCashProfit = 0, totalRelativeProfit = 0;
    holdings.forEach((t) => {
      const smart = t.current_market_price != null ? Number(t.current_market_price) : null;
      const lowest = t.steam_lowest_sell_price != null ? Number(t.steam_lowest_sell_price) : null;
      if (smart == null || smart <= 0) return;
      const smartAfterTax = smart / 1.15;
      const cost = Number(t.price) || 0;
      if (smartAfterTax > 0 && cost > 0) { ratioSum += cost / smartAfterTax; ratioCount += 1; }
      if (lowest != null && lowest > 0) {
        const valuationAfterTax = lowest / 1.15;
        valuationCount += 1;
        totalSelfUseProfit += valuationAfterTax * SELF_USE_PROFIT_RATIO - cost;
        totalCashProfit += valuationAfterTax * CASH_PROFIT_RATIO - cost;
        totalRelativeProfit += valuationAfterTax * RELATIVE_PROFIT_RATIO - cost;
      }
    });
    const discountRatio = ratioCount > 0 ? (ratioSum / ratioCount).toFixed(4) : "—";
    const discountRatioClass = discountRatio !== "—" ? (parseFloat(discountRatio) > ratio ? "text-bad" : "text-ok") : "";
    const selfUseProfitVal = valuationCount > 0 ? totalSelfUseProfit : null;
    const cashProfitVal = valuationCount > 0 ? totalCashProfit : null;
    const relativeProfitVal = valuationCount > 0 ? totalRelativeProfit : null;
    const selfUseProfitClass = selfUseProfitVal != null && selfUseProfitVal > 0 ? "text-ok" : selfUseProfitVal != null && selfUseProfitVal < 0 ? "text-bad" : "";
    const cashProfitClass = cashProfitVal != null && cashProfitVal > 0 ? "text-ok" : cashProfitVal != null && cashProfitVal < 0 ? "text-bad" : "";
    const relativeProfitClass = relativeProfitVal != null && relativeProfitVal > 0 ? "text-ok" : relativeProfitVal != null && relativeProfitVal < 0 ? "text-bad" : "";
    const cashProfitStr = cashProfitVal != null ? (cashProfitVal >= 0 ? "+" : "") + cashProfitVal.toFixed(2) : "—";
    const selfUseProfitStr = selfUseProfitVal != null ? (selfUseProfitVal >= 0 ? "+" : "") + selfUseProfitVal.toFixed(2) : "—";
    const relativeProfitStr = relativeProfitVal != null ? (relativeProfitVal >= 0 ? "+" : "") + relativeProfitVal.toFixed(2) : "—";
    summaryEl.innerHTML = [
      `<span class="summary-stat"><span class="summary-label">数量</span><span class="summary-value mono">${holdings.length}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总购入价</span><span class="summary-value mono">${totalPrice.toFixed(2)}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总购入时 Steam 智能参考价</span><span class="summary-value mono">${totalMp.toFixed(2)}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总Steam智能参考价</span><span class="summary-value mono">${cmpStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总Steam最低卖价</span><span class="summary-value mono">${lowestStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总税后价格</span><span class="summary-value mono">${afterTaxStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">实际折扣比率</span><span class="summary-value mono ${discountRatioClass}">${discountRatio}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总自用收益（×0.75）</span><span class="summary-value mono ${selfUseProfitClass}">${selfUseProfitStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总变现收益（×0.8）</span><span class="summary-value mono ${cashProfitClass}">${cashProfitStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总相对收益（×1）</span><span class="summary-value mono ${relativeProfitClass}">${relativeProfitStr}</span></span>`,
      `<span class="summary-stat"><span class="summary-label">总市场变动</span><span class="summary-value mono ${plClass}">${plStr}</span></span>`,
    ].join("");
  } else if (summaryEl) {
    summaryEl.textContent = "";
    summaryEl.style.display = "none";
  }
  if (summaryEl && holdings.length) summaryEl.style.display = "";
  if (summaryEl && !holdings.length) summaryEl.style.display = "none";
  if (tbodyS) renderTxTable(tbodyS, sales, false);
  refreshAnalytics(purchases, ratio);
  syncHoldingsMultiSelectUI();
}
function syncHoldingsMultiSelectUI() {
  const selectTh = el("holding-select-th");
  const batchBar = el("holdings-batch-actions");
  const multiselectBtn = el("btn-holdings-multiselect");
  if (holdingsMultiSelectMode) {
    if (selectTh) selectTh.classList.remove("hidden");
    if (batchBar) { batchBar.classList.remove("hidden"); batchBar.style.display = "flex"; }
    if (multiselectBtn) multiselectBtn.textContent = "取消多选";
  } else {
    if (selectTh) selectTh.classList.add("hidden");
    if (batchBar) { batchBar.classList.add("hidden"); batchBar.style.display = "none"; }
    if (multiselectBtn) multiselectBtn.textContent = "多选";
  }
}
function syncHistoryMultiSelectUI() {
  const selectTh = el("history-select-th");
  const batchBar = el("history-batch-actions");
  const multiselectBtn = el("btn-history-multiselect");
  if (historyMultiSelectMode) {
    if (selectTh) selectTh.classList.remove("hidden");
    if (batchBar) { batchBar.classList.remove("hidden"); batchBar.style.display = "flex"; }
    if (multiselectBtn) multiselectBtn.textContent = "取消多选";
  } else {
    if (selectTh) selectTh.classList.add("hidden");
    if (batchBar) { batchBar.classList.add("hidden"); batchBar.style.display = "none"; }
    if (multiselectBtn) multiselectBtn.textContent = "多选";
  }
}
function getCurrentPriceRefreshMinutes() {
  return Math.max(1, parseInt(el("cfg-current-price-refresh-minutes")?.value, 10) || 10);
}
async function refreshTransactions(options = {}) {
  const { reportError = true, rethrow = false } = options;
  const tbodyP = document.querySelector("#transactions-table-purchases tbody");
  const tbodyS = document.querySelector("#transactions-table-sales tbody");
  const tbodyHistory = document.querySelector("#transactions-table-purchase-history tbody");
  const summaryEl = el("purchases-summary");
  try {
    const d = await fetchJson(API + "/transactions?enrich_current_price=0");
    const all = d.transactions || [];
    const byKey = (t) => `${t.type}:${t.idx}`;
    const enrichedMap = new Map((lastEnrichData || []).map((t) => [byKey(t), t]));
    for (const t of all) {
      const e = enrichedMap.get(byKey(t));
      if (e && e.current_market_price != null) t.current_market_price = e.current_market_price;
      if (e && e.steam_lowest_sell_price != null) t.steam_lowest_sell_price = e.steam_lowest_sell_price;
      if (e && e.current_market_price_state) t.current_market_price_state = e.current_market_price_state;
      if (t.type === "purchase" && !(t.sale_price != null && Number(t.sale_price) > 0)) {
        const platformState = holdingPlatformPriceStates[String(t.name || "").trim()];
        if (platformState) {
          t.platform_quotes = platformState.quotes || {};
          t.platform_price_state = platformState;
        }
      }
    }
    lastEnrichData = all;
    applyTransactionsToUI(all, summaryEl, tbodyP, tbodyS, tbodyHistory, d.resell_ratio);
    updateHoldingsPriceRefreshStatus(all);
    return all;
  } catch (e) {
    if (reportError) toast("加载操作记录失败", e.message || "");
    if (rethrow) throw e;
    return null;
  }
}

    <script>
(() => {
  "use strict";

  const state = document.querySelector("#state");
  const app = document.querySelector("#app");

  function decodeBytes(encoded) {
    const normalized = String(encoded || "").replace(/-/g, "+").replace(/_/g, "/");
    const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
    if (typeof atob !== "function" || typeof Uint8Array !== "function") {
      throw new Error("当前浏览器不支持快照解码");
    }
    const binary = atob(padded);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) {
      bytes[index] = binary.charCodeAt(index);
    }
    return bytes;
  }

  function decodeUtf8(bytes) {
    if (typeof TextDecoder === "function") {
      return new TextDecoder().decode(bytes);
    }
    // Fallback for older embedded WebViews that have atob but no TextDecoder.
    let binary = "";
    for (let index = 0; index < bytes.length; index += 1) {
      binary += String.fromCharCode(bytes[index]);
    }
    return decodeURIComponent(escape(binary));
  }

  function decode(encoded) {
    return JSON.parse(decodeUtf8(decodeBytes(encoded)));
  }

  async function decodeCompressed(encoded) {
    const bytes = decodeBytes(encoded);
    if (typeof DecompressionStream !== "function") {
      throw new Error("当前浏览器不支持压缩快照链接");
    }
    const stream = new Blob([bytes])
      .stream()
      .pipeThrough(new DecompressionStream("deflate"));
    const buffer = await new Response(stream).arrayBuffer();
    return JSON.parse(decodeUtf8(new Uint8Array(buffer)));
  }

  function legacyPayload(payload) {
    const source = payload && typeof payload === "object" ? payload : {};
    const quotes = {};
    for (const row of Array.isArray(source.platform_results) ? source.platform_results : []) {
      if (row && row.platform) quotes[String(row.platform).toUpperCase()] = row;
    }
    const overview = source.market_overview && typeof source.market_overview === "object"
      ? source.market_overview
      : {};
    const item = {
      market_hash_name: source.market_hash_name || source.name || "",
      goods_id: source.goods_id,
      quotes,
      provider_quotes: source.provider_quotes || {},
      market_overview: overview,
      source_status: overview.source_status || {},
      source_comparisons: overview.source_comparisons || {},
      steam_snapshot: overview.steam_snapshot || {
        smart_reference_price: source.steam_reference_price,
        last_success_at: source.recorded_at,
        source: "legacy_strategy_snapshot",
      },
      metrics: { actual_discount: source.best_discount },
      purchase_price: source.best_price,
      max_discount: source.max_discount,
      best_platform: source.best_platform,
      best_price: source.best_price,
      best_discount: source.best_discount,
      record_id: source.record_id ?? source.id ?? null,
      recorded_at: source.recorded_at,
      candidate_price: source.candidate_price,
      candidate_ratio: source.candidate_ratio,
      daily_volume: source.daily_volume,
      history: overview.history || { status: "unavailable", rows: [], error: "该快照未记录历史行情" },
      recent_records: overview.recent_records || [],
      links: Array.isArray(source.links) ? source.links : [],
    };
    return {
      record: {
        id: source.record_id ?? source.id ?? null,
        record_source: source.record_source || "pipeline",
        name: source.name || source.market_hash_name || item.market_hash_name,
        market_hash_name: item.market_hash_name,
        goods_id: source.goods_id,
        best_price: source.best_price,
        analysis: source.analysis || {},
        market_item: item,
      },
      item,
    };
  }

  function normalizePayload(payload) {
    if (payload?.v === 2 && payload.item && typeof payload.item === "object") {
      const item = payload.item;
      const rawRecord = payload.record && typeof payload.record === "object" ? payload.record : {};
      const id = rawRecord.id ?? rawRecord.record_id ?? item.record_id ?? null;
      return {
        item,
        record: {
          ...rawRecord,
          id,
          record_source: rawRecord.record_source || item.record_source || "pipeline",
          name: rawRecord.name || rawRecord.market_hash_name || item.market_hash_name,
          market_hash_name: rawRecord.market_hash_name || item.market_hash_name,
          goods_id: rawRecord.goods_id ?? item.goods_id,
          market_item: item,
        },
      };
    }
    return legacyPayload(payload);
  }

  function showError(title, message) {
    state.hidden = false;
    app.hidden = true;
    state.innerHTML = `<div class="state-card"><h1>${escapeHtml(title)}</h1><p>${escapeHtml(message)}</p></div>`;
  }

  async function render() {
    const params = new URLSearchParams(location.search);
    const encoded = params.get("data");
    const compressed = params.get("z");
    if (!encoded && !compressed) {
      showError("缺少快照数据", "请从 PushPlus 的完整行情快照链接进入。这个页面不会自行读取账号或实时行情。");
      return;
    }
    let normalized;
    try {
      normalized = normalizePayload(
        encoded ? decode(encoded) : await decodeCompressed(compressed),
      );
    } catch (error) {
      console.error("无法解析 Push 快照", error);
      showError("快照链接无效", "链接中的行情快照无法解析，可能已被截断。请从 AetherSwap 的命中记录重新 Push。");
      return;
    }
    if (typeof window.renderUnifiedMarketDetail !== "function") {
      showError("详情组件未加载", "共享行情详情组件未加载，请稍后重试或重新部署 EdgeOne 静态包。");
      return;
    }
    const detail = window.renderUnifiedMarketDetail({
      record: normalized.record,
      mode: "hit",
      options: { actions: false, publicSnapshot: true },
    });
    app.innerHTML = `<div class="push-detail-note">这是 Push 携带的不可变行情快照；页面使用 AetherSwap 本地命中详情的同一套数据结构、渲染器和样式。</div>${detail}`;
    state.hidden = true;
    app.hidden = false;
    app.querySelectorAll("[data-market-detail-record-id]").forEach((button) => {
      button.disabled = true;
      button.textContent = "本地详情";
      button.title = "该公共快照只携带当前商品，不连接本地数据库";
    });
  }

  void render();
})();

</script>
